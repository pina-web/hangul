    }
    if (!['rect', 'ellipse'].includes(n)) return hasText ? { block: `<div class="textbox">${inner}</div>` } : {};
    if (pl.inline) return hasText ? { block: `<div class="textbox">${inner}</div>` } : {};
    const ratio = num(el.getAttribute('ratio'), 0);
    const radius = n === 'ellipse' ? '50%' : ratio ? Math.round(Math.min(w, h) * ratio / 100) + 'px' : '0';
    const bst = [`padding:${Math.round(pad)}px`, `justify-content:${({ CENTER: 'center', BOTTOM: 'flex-end' })[va] || 'flex-start'}`, `border-radius:${radius}`];
    if (fill) bst.push('background-color:' + fill);
    if (stroke) bst.push(`border:${sw}px ${lsty === 'DASH' ? 'dashed' : 'solid'} ${stroke}`);
    return { html: fobj(pl, w, h, `<div class="tbox" contenteditable="true" style="${bst.join(';')}">${hasText ? inner : '<p><br></p>'}</div>`, n === 'ellipse' ? ' data-kind="ellipse"' : '') };
  }

  function plain(html) { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g, ' ').trim(); }
  async function headerFooter(el, ctx, which) {
    const sl = kid(el, 'subList'); if (!sl) return;
    const hf = ctx.hf || (ctx.hf = {});
    const texts = [];
    for (const ip of kids(sl, 'p')) {
      const nums = desc(ip, 'autoNum').filter((a) => /PAGE/.test(a.getAttribute('numType') || ''));
      const pp = ctx.H.paras[ip.getAttribute('paraPrIDRef')];
      const align = pp ? (pp.align === 'justify' ? 'left' : pp.align) : 'center';
      if (nums.length) {
        const t = desc(ip, 't').map((x) => x.textContent).join('');
        const fmt = nums.some((a) => a.getAttribute('numType') === 'TOTAL_PAGE') ? 'total' : /-/.test(t) ? 'dash' : /쪽/.test(t) ? 'jjok' : 'n';
        hf.pnum = { pos: (which === 'header' ? 'top-' : 'bottom-') + align, fmt };
      } else {
        const t = plain(await renderPara(ip, ctx));
        if (t) { texts.push(t); if (!hf[which]) hf[which] = { align }; }
      }
    }
    if (texts.length) hf[which] = Object.assign(hf[which] || {}, { text: texts.join(' ') });
  }

  async function renderPara(p, ctx) {
    const { H } = ctx;
    const pp = H.paras[p.getAttribute('paraPrIDRef')];
    const pst = paraStyle(pp);
    const blocks = []; let cur = ''; let linkOpen = false;
    const pageBreak = p.getAttribute('pageBreak') === '1' || (pp && pp.breakBefore);
    const flush = (force) => { if (linkOpen) { cur += '</a>'; linkOpen = false; } if (cur || force) blocks.push({ t: 'p', html: cur }); cur = ''; };
    for (const run of kids(p, 'run')) {
      const st = charStyle(H.chars[run.getAttribute('charPrIDRef')]);
      for (const el of Array.from(run.children)) {
        const n = el.localName;
        if (n === 't') {
          let s = '';
          for (const node of Array.from(el.childNodes)) {
            if (node.nodeType === 3) s += esc(node.nodeValue);
            else if (node.nodeType === 1) {
              const ln = node.localName;
              if (ln === 'tab') s += '<span class="tab">\t</span>';
              else if (ln === 'lineBreak') s += '<br>';
              else if (ln === 'nbSpace' || ln === 'fwSpace') s += '&nbsp;';
              else if (ln === 'hyphen') s += '-';
              else if (node.textContent) s += esc(node.textContent);
            }
          }
          if (s) { s = s.replace(/ {2}/g, ' &nbsp;'); cur += st ? `<span style="${st}">${s}</span>` : s; }
        } else if (n === 'secPr') readSecPr(el, ctx);
        else if (n === 'ctrl') {
          for (const c of Array.from(el.children)) {
            const cn = c.localName;
            if (cn === 'header' || cn === 'footer') await headerFooter(c, ctx, cn);
            else if (cn === 'fieldBegin' && c.getAttribute('type') === 'HYPERLINK') {
              const path = desc(c, 'stringParam').find((x) => x.getAttribute('name') === 'Path');
              const url = (path && path.textContent) || c.getAttribute('name') || '';
              if (/^(https?:|mailto:)/i.test(url)) { if (linkOpen) cur += '</a>'; cur += `<a href="${esc(url).replace(/"/g, '&quot;')}">`; linkOpen = true; }
            } else if (cn === 'fieldEnd') { if (linkOpen) { cur += '</a>'; linkOpen = false; } }
            else if (cn === 'footNote' || cn === 'endNote') {
              let t = '';
              for (const sl of desc(c, 'subList')) for (const ip of kids(sl, 'p')) t += ' ' + desc(ip, 't').map((x) => x.textContent).join('');
              cur += `<span class="fn" contenteditable="false" data-note="${esc(t.trim()).replace(/"/g, '&quot;')}"></span>`;
            } else if (cn === 'pageNum') {
              const pos = (c.getAttribute('pos') || 'BOTTOM_CENTER').toLowerCase().replace('_', '-');
              if (!/none/.test(pos)) { ctx.hf = ctx.hf || {}; if (!ctx.hf.pnum) ctx.hf.pnum = { pos, fmt: c.getAttribute('sideChar') ? 'dash' : 'n' }; }
            }
          }
        } else if (n === 'tbl') { flush(false); blocks.push({ t: 'raw', html: await renderTable(el, ctx) }); }
        else if (n === 'pic') {
          const img = desc(el, 'img')[0];
          const sz = kid(el, 'curSz') || kid(el, 'sz');
          const w = sz ? num(sz.getAttribute('width')) / 75 : 0, h = sz ? num(sz.getAttribute('height')) / 75 : 0;
          const src = img ? await ctx.imgData(img.getAttribute('binaryItemIDRef')) : null;
          const pl = placement(el);
          if (src === 'unsupported') cur += '<span class="ph" title="WMF/EMF 그림은 표시할 수 없습니다">[그림]</span>';
          else if (src) {
            const wh = w && h ? ` width="${Math.round(w)}" height="${Math.round(h)}"` : '';
            if (pl.inline) cur += `<img src="${src}"${wh} alt="">`;
            else if (pl.wrap === 'square') cur += `<img src="${src}"${wh} alt="" data-wrap="square" style="float:${pl.halign === 'RIGHT' ? 'right' : 'left'}">`;
            else if (pl.wrap === 'block') cur += `<img src="${src}"${wh} alt="" data-wrap="block" data-align="${({ RIGHT: 'right', CENTER: 'center' })[pl.halign] || 'left'}">`;
            else cur += fobj(pl, w, h, `<img src="${src}" alt="">`);
          }
        } else if (n === 'equation') {
          const sc = desc(el, 'script')[0];
          if (sc) cur += `<span class="eq" title="수식">${esc(sc.textContent)}</span>`;
        } else if (['rect', 'ellipse', 'line', 'polygon', 'container', 'curve', 'arc'].includes(n)) {
          const r = await shapeHtml(el, ctx);
          if (r.inline) cur += r.inline;
          if (r.html) cur += r.html;
          if (r.block) { flush(false); blocks.push({ t: 'raw', html: r.block }); }
        }
      }
    }
    flush(!blocks.length);
    let out = ''; let first = true;
    for (const b of blocks) {
      // 떠 있는 개체(글상자 안에 문단이 있음)를 품은 문단은 <div>로 — <p> 안에는 블록을 넣을 수 없음
      const tag = b.t !== 'raw' && /class="fobj"/.test(b.html) ? 'div' : 'p';
      let h = b.t === 'raw' ? b.html : `<${tag} style="${pst}">${b.html || '<br>'}</${tag}>`;
      if (first && pageBreak) h = h.replace(/^<(p|table|div)/, '<$1 class="pb-before"');
      out += h; first = false;
    }
    return out;
  }

  async function renderTable(tbl, ctx) {
    const { H } = ctx;
    const tblBf = H.bfs[tbl.getAttribute('borderFillIDRef')];
    const rows = kids(tbl, 'tr');
    // 열 너비
    const colCnt = num(tbl.getAttribute('colCnt'), 0);
    const colW = new Array(colCnt).fill(0);
    for (const tr of rows) for (const tc of kids(tr, 'tc')) {
      const a = kid(tc, 'cellAddr'), sp = kid(tc, 'cellSpan'), sz = kid(tc, 'cellSz');
      if (a && sp && sz && num(sp.getAttribute('colSpan'), 1) === 1) {
        const c = num(a.getAttribute('colAddr')); if (c < colCnt) colW[c] = Math.max(colW[c], num(sz.getAttribute('width')));
      }
    }
    const total = colW.reduce((a, b) => a + b, 0);
    let html = `<table class="hwp-table${tblBf && tblBf.none ? ' noborder' : ''}"${total ? ` style="width:${Math.round(total / 75)}px"` : ''}>`;
    if (total && colW.every((x) => x > 0)) html += '<colgroup>' + colW.map((w) => `<col style="width:${Math.round(w / 75)}px">`).join('') + '</colgroup>';
    for (const tr of rows) {
      html += '<tr>';
      for (const tc of kids(tr, 'tc')) {
        const sp = kid(tc, 'cellSpan'), sz = kid(tc, 'cellSz');
        const cs = sp ? num(sp.getAttribute('colSpan'), 1) : 1, rs = sp ? num(sp.getAttribute('rowSpan'), 1) : 1;
        const bf = H.bfs[tc.getAttribute('borderFillIDRef')];
        const st = [];
        if (bf && bf.fill) st.push('background-color:' + bf.fill);
        if (bf && bf.none) st.push('border-style:dotted;border-color:#d6dae3');
        if (sz && num(sz.getAttribute('height'))) st.push('height:' + Math.round(num(sz.getAttribute('height')) / 75) + 'px');
        const sl = kid(tc, 'subList');
        const va = sl ? (sl.getAttribute('vertAlign') || 'CENTER') : 'CENTER';
        st.push('vertical-align:' + ({ TOP: 'top', CENTER: 'middle', BOTTOM: 'bottom' }[va] || 'middle'));
        let inner = '';
        if (sl) for (const ip of kids(sl, 'p')) inner += await renderPara(ip, ctx);
        html += `<td${cs > 1 ? ` colspan="${cs}"` : ''}${rs > 1 ? ` rowspan="${rs}"` : ''} style="${st.join(';')}">${inner || '<p><br></p>'}</td>`;
      }
      html += '</tr>';
    }
    return html + '</table>';
  }

  return { read };
})();

/* ---- hwpx-write.js ---- */
/* ===== 문서 모델 → HWPX 패키지 =====
 * 한컴 OWPML 구조를 따르는 검증된 빈 문서(Skeleton.hwpx)를 바탕으로
 * header.xml에 글자모양·문단모양·테두리를 추가하고 section0.xml 본문을 새로 쓴다.
 * build()        : 한글 문서(문단 흐름 + 떠 있는 개체 + 머리말/꼬리말/쪽 번호/각주/링크)
 * buildDesign()  : 디자인 프로젝트(쪽마다 종이 기준으로 놓인 글상자·그림·도형)
 */
const HWPXWriter = (() => {
  const X = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const HU = 75; // 1px(96dpi) = 75 HWPUNIT
  const MM = 283.465; // 1mm = 283.465 HWPUNIT
  const PXMM = 96 / 25.4;

  function b64ToU8(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

  async function dataUrlToImage(src) {
    // png/jpg/gif/bmp는 그대로, 그 외(webp·svg 등)는 PNG로 바꿈
    let mime = '', bytes = null;
    const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(src || '');
    if (m) {
      mime = m[1].toLowerCase();
      bytes = m[2] ? b64ToU8(m[3]) : new TextEncoder().encode(decodeURIComponent(m[3]));
    } else {
      try { const r = await fetch(src); const b = await r.blob(); mime = b.type; bytes = new Uint8Array(await b.arrayBuffer()); } catch (e) { return null; }
    }
    const ok = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/gif': 'gif', 'image/bmp': 'bmp' }[mime];
    if (ok) return { bytes, ext: ok, mime: mime === 'image/jpg' ? 'image/jpeg' : mime };
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const cv = document.createElement('canvas'); cv.width = img.naturalWidth || 300; cv.height = img.naturalHeight || 150;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const png = await new Promise((res) => cv.toBlob(res, 'image/png'));
      return { bytes: new Uint8Array(await png.arrayBuffer()), ext: 'png', mime: 'image/png' };
    } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
  }

  const IDENT = '<hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/>';
  const geom = (w, h, oh) => `<hp:offset x="0" y="0"/><hp:orgSz width="${w}" height="${oh === undefined ? h : oh}"/><hp:curSz width="${w}" height="${oh === undefined ? h : oh}"/><hp:flip horizontal="0" vertical="0"/><hp:rotationInfo angle="0" centerX="${w >> 1}" centerY="${h >> 1}" rotateimage="1"/><hp:renderingInfo>${IDENT}</hp:renderingInfo>`;
  const WRAP = { square: 'SQUARE', block: 'TOP_AND_BOTTOM', front: 'IN_FRONT_OF_TEXT', behind: 'BEHIND_TEXT' };
  // 위치: 글자처럼 취급 / 문단 기준 정렬(어울림·자리 차지) / 종이 기준 좌표(글 앞·뒤)
  function posXml(o) {
    if (!o || o.inline) return '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>';
    if (o.wrap === 'front' || o.wrap === 'behind') {
      return `<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="0" allowOverlap="1" holdAnchorAndSO="0" vertRelTo="PAPER" horzRelTo="PAPER" vertAlign="TOP" horzAlign="LEFT" vertOffset="${Math.max(0, Math.round(o.y * HU))}" horzOffset="${Math.max(0, Math.round(o.x * HU))}"/>`;
    }
    const ha = ({ left: 'LEFT', center: 'CENTER', right: 'RIGHT' })[o.align] || 'LEFT';
    return `<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="${ha}" vertOffset="0" horzOffset="0"/>`;
  }
  const outMargin = (o) => (o && o.wrap === 'square' ? '<hp:outMargin left="567" right="567" top="283" bottom="283"/>' : '<hp:outMargin left="0" right="0" top="0" bottom="0"/>');

  /* ---------- 공용 작업 틀 ---------- */
  async function context(page, meta = {}) {
    const skel = await JSZip.loadAsync(b64ToU8(SKELETON_B64));
    const files = {};
    for (const name of Object.keys(skel.files)) {
      if (skel.files[name].dir) continue;
      files[name] = await skel.file(name).async(name.endsWith('.png') ? 'uint8array' : 'string');
    }
    const C = { files, page, meta, header: files['Contents/header.xml'], sec: files['Contents/section0.xml'] };
    const fontfaceRe = /<hh:fontface lang="([A-Z]+)" fontCnt="(\d+)">([\s\S]*?)<\/hh:fontface>/g;
    const existing = {};
    C.header.replace(fontfaceRe, (m, lang, cnt, body) => { if (lang === 'HANGUL') body.replace(/<hh:font id="(\d+)" face="([^"]*)"/g, (mm, id, face) => { existing[face] = +id; }); return m; });
    const baseFontCount = Object.keys(existing).length;
    const newFonts = []; const fontIds = {};
    C.fontId = (name) => {
      if (!name) return 1; // 함초롬바탕
      if (existing[name] !== undefined) return existing[name];
      if (fontIds[name] !== undefined) return fontIds[name];
      const id = baseFontCount + newFonts.length; newFonts.push(name); fontIds[name] = id; return id;
    };
    const bfList = []; const bfKey = {};
    C.borderFill = (border, fill) => {
      const key = (border ? 'S' : 'N') + (fill || '');
      if (bfKey[key]) return bfKey[key];
      const id = 3 + bfList.length;
      const side = (n) => `<hh:${n} type="${border ? 'SOLID' : 'NONE'}" width="0.12 mm" color="#000000"/>`;
      const fillXml = fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : '';
      bfList.push(`<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>${side('leftBorder')}${side('rightBorder')}${side('topBorder')}${side('bottomBorder')}<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>${fillXml}</hh:borderFill>`);
      bfKey[key] = id; return id;
    };
    const charBase = (C.header.match(/<hh:charProperties itemCnt="(\d+)">/) || [0, 7])[1] | 0;
    const charList = []; const charKey = {};
    C.charPr = (r) => {
      const o = { b: !!r.b, i: !!r.i, u: !!r.u, s: !!r.s, sup: !!r.sup, sub: !!r.sub, color: r.color || '#000000', bg: r.bg || '', size: r.size || 10, font: r.font || '',
        ls: Math.max(-50, Math.min(50, Math.round(r.ls || 0))), sh: !!r.shadow, ol: !!r.outline };
      const key = JSON.stringify(o);
      if (charKey[key] !== undefined) return charKey[key];
      const id = charBase + charList.length;
      const f = C.fontId(o.font);
      const seven = (v) => `hangul="${v}" latin="${v}" hanja="${v}" japanese="${v}" other="${v}" symbol="${v}" user="${v}"`;
      let x = `<hh:charPr id="${id}" height="${Math.round(o.size * 100)}" textColor="${o.color}" shadeColor="${o.bg || 'none'}" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">`;
      x += `<hh:fontRef ${seven(f)}/><hh:ratio ${seven(100)}/><hh:spacing ${seven(o.ls)}/><hh:relSz ${seven(100)}/><hh:offset ${seven(0)}/>`;
      if (o.i) x += '<hh:italic/>';
      if (o.b) x += '<hh:bold/>';
      x += `<hh:underline type="${o.u ? 'BOTTOM' : 'NONE'}" shape="SOLID" color="${o.u ? o.color : '#000000'}"/>`;
      x += `<hh:strikeout shape="${o.s ? 'SOLID' : 'NONE'}" color="#000000"/>`;
      x += `<hh:outline type="${o.ol ? 'SOLID' : 'NONE'}"/>`;
      x += `<hh:shadow type="${o.sh ? 'DROP' : 'NONE'}" color="#B2B2B2" offsetX="10" offsetY="10"/>`;
      if (o.sup) x += '<hh:supscript/>'; else if (o.sub) x += '<hh:subscript/>';
      x += '</hh:charPr>';
      charList.push(x); charKey[key] = id; return id;
    };
    const paraBase = (C.header.match(/<hh:paraProperties itemCnt="(\d+)">/) || [0, 20])[1] | 0;
    const paraList = []; const paraKey = {};
    C.paraPr = (b) => {
      const o = {
        align: ({ left: 'LEFT', right: 'RIGHT', center: 'CENTER', justify: 'JUSTIFY' })[b.align] || 'JUSTIFY',
        lh: b.lh || 160, ml: Math.round(Math.max(0, (b.ml || 0) + Math.min(0, b.ti || 0)) * HU), mr: Math.round((b.mr || 0) * HU), ti: Math.round((b.ti || 0) * HU),
        mt: Math.round((b.mt || 0) * HU), mb: Math.round((b.mb || 0) * HU), kn: !!b.keepNext,
      };
      const key = JSON.stringify(o);
      if (paraKey[key] !== undefined) return paraKey[key];
      const id = paraBase + paraList.length;
      const margin = (k) => `<hh:margin><hc:intent value="${o.ti * k}" unit="HWPUNIT"/><hc:left value="${o.ml * k}" unit="HWPUNIT"/><hc:right value="${o.mr * k}" unit="HWPUNIT"/><hc:prev value="${o.mt * k}" unit="HWPUNIT"/><hc:next value="${o.mb * k}" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${o.lh}" unit="HWPUNIT"/>`;
      paraList.push(`<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR"><hh:align horizontal="${o.align}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/><hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="BREAK_WORD" widowOrphan="0" keepWithNext="${o.kn ? 1 : 0}" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/><hh:autoSpacing eAsianEng="0" eAsianNum="0"/><hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${margin(1)}</hp:case><hp:default>${margin(2)}</hp:default></hp:switch><hh:border borderFillIDRef="2" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`);
      paraKey[key] = id; return id;
    };
    const bins = [];
    C.bins = bins;
    let objId = 1000000; C.nextId = () => ++objId;
    let paraId = 3000000; C.nextPara = () => ++paraId;
    let z = 0; C.nextZ = () => z++;
    C.textWidth = Math.round((page.w - page.ml - page.mr) * MM);
    C.addBin = async (src) => {
      const im = await dataUrlToImage(src);
      if (!im) return null;
      const id = 'BIN' + String(bins.length + 1).padStart(4, '0');
      bins.push({ id, name: `BinData/${id}.${im.ext}`, bytes: im.bytes, mime: im.mime });
      return id;
    };

    /* ----- 개체 ----- */
    C.picXml = async (src, wPx, hPx, place) => {
      const bin = await C.addBin(src); if (!bin) return '';
      let w = Math.max(1, Math.round(wPx * HU)), h = Math.max(1, Math.round(hPx * HU));
      if (place.inline && w > C.textWidth) { h = Math.round(h * C.textWidth / w); w = C.textWidth; }
      const oid = C.nextId(); const wrap = place.inline ? 'SQUARE' : WRAP[place.wrap] || 'SQUARE';
      return `<hp:pic textWrap="${wrap}" textFlow="BOTH_SIDES" reverse="0" id="${oid}" zOrder="${C.nextZ()}" numberingType="PICTURE" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${oid}">${geom(w, h)}<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:imgRect><hp:imgClip left="0" right="${w}" top="0" bottom="${h}"/><hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="${w}" dimheight="${h}"/><hc:img binaryItemIDRef="${bin}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/><hp:sz width="${w}" height="${h}" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/>${posXml(place)}${outMargin(place)}<hp:shapeComment/></hp:pic>`;
    };
    const lineShape = (o) => {
      const has = o.stroke && (o.sw || 0) > 0;
      return `<hp:lineShape color="${has ? o.stroke : '#000000'}" width="${has ? Math.max(1, Math.round(o.sw * HU)) : 0}" style="${has ? (o.dash ? 'DASH' : 'SOLID') : 'NONE'}" endCap="FLAT" headStyle="NORMAL" tailStyle="${o.arrow ? 'ARROW' : 'NORMAL'}" headfill="1" tailfill="1" headSz="MEDIUM_MEDIUM" tailSz="MEDIUM_MEDIUM" outlineStyle="NORMAL" alpha="0"/>`;
    };
    // 글상자·사각형·원 (글이 있으면 drawText)
    C.boxXml = async (o) => {
      const w = Math.max(1, Math.round(o.w * HU)), h = Math.max(1, Math.round(o.h * HU));
      const oid = C.nextId();
      const fill = o.fill ? `<hc:fillBrush><hc:winBrush faceColor="${o.fill}" hatchColor="#FFFFFF" alpha="0"/></hc:fillBrush>` : '';
      let text = '';
      if (o.blocks && o.blocks.length) {
        let paras = '';
        for (const b of o.blocks) paras += await C.blockXml(b);
        const m = Math.round((o.pad || 0) * HU);
        text = `<hp:drawText lastWidth="${w}" name="" editable="0"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${o.va || 'TOP'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras}</hp:subList><hp:textMargin left="${m}" right="${m}" top="${m}" bottom="${m}"/></hp:drawText>`;
      }
      const shadow = '<hp:shadow type="NONE" color="#B2B2B2" offsetX="0" offsetY="0" alpha="0"/>';
      const head = `id="${oid}" zOrder="${C.nextZ()}" numberingType="NONE" textWrap="${WRAP[o.wrap] || 'IN_FRONT_OF_TEXT'}" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${oid}"`;
      const tail = `<hp:sz width="${w}" height="${h}" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/>${posXml(o)}${outMargin(o)}`;
      if (o.shape === 'ellipse') {
        const cx = w >> 1, cy = h >> 1;
        return `<hp:ellipse intervalDirty="0" hasArcPr="0" arcType="NORMAL" ${head}>${geom(w, h)}${lineShape(o)}${fill}${text}${shadow}<hc:center x="${cx}" y="${cy}"/><hc:ax1 x="${w}" y="${cy}"/><hc:ax2 x="${cx}" y="${h}"/><hc:start1 x="${w}" y="${cy}"/><hc:end1 x="${w}" y="${cy}"/><hc:start2 x="${w}" y="${cy}"/><hc:end2 x="${w}" y="${cy}"/>${tail}</hp:ellipse>`;
      }
      const ratio = Math.max(0, Math.min(50, Math.round((o.radius || 0) / Math.max(1, Math.min(o.w, o.h)) * 100)));
      return `<hp:rect ratio="${ratio}" ${head}>${geom(w, h)}${lineShape(o)}${fill}${text}${shadow}<hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/>${tail}</hp:rect>`;
    };
    C.lineXml = (o) => {
      const w = Math.max(1, Math.round(o.w * HU)); const oid = C.nextId();
      const y = (o.y || 0) + (o.h || 0) / 2;
      return `<hp:line isReverseHV="0" id="${oid}" zOrder="${C.nextZ()}" numberingType="NONE" textWrap="${WRAP[o.wrap] || 'IN_FRONT_OF_TEXT'}" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${oid}">${geom(w, 0, 1)}${lineShape(Object.assign({}, o, { stroke: o.stroke || '#000000', sw: Math.max(0.5, o.sw || 1) }))}<hp:shadow type="NONE" color="#B2B2B2" offsetX="0" offsetY="0" alpha="0"/><hc:startPt x="0" y="0"/><hc:endPt x="${w}" y="0"/><hp:sz width="${w}" height="0" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/>${posXml(Object.assign({}, o, { y }))}${outMargin(o)}</hp:line>`;
    };
    C.objXml = async (ob) => {
      if (ob.kind === 'pic') return C.picXml(ob.src, ob.w, ob.h, ob);
      if (ob.kind === 'line') return C.lineXml(ob);
      return C.boxXml(ob);
    };

    /* ----- 글 ----- */
    const fieldCmd = (url) => url.replace(/\\/g, '\\\\').replace(/:/g, '\\:').replace(/;/g, '\\;') + ';1;0;0;';
    let fnNo = 0;
    C.footnoteCount = () => fnNo;
    C.runsXml = async (runs, fallbackStyle) => {
      let out = ''; let cur = null; let buf = '';
      const close = () => { if (cur !== null) out += `<hp:run charPrIDRef="${cur}"><hp:t>${buf}</hp:t></hp:run>`; cur = null; buf = ''; };
      let lastStyle = fallbackStyle; let link = null;
      const linkOpen = (url) => {
        close(); const bid = C.nextId(), fid = C.nextId(); link = { bid, fid };
        out += `<hp:run charPrIDRef="${C.charPr(lastStyle || {})}"><hp:ctrl><hp:fieldBegin id="${bid}" type="HYPERLINK" name="${X(url)}" editable="0" dirty="0" zorder="-1" fieldid="${fid}"><hp:parameters cnt="6" name=""><hp:integerParam name="Prop">0</hp:integerParam><hp:stringParam name="Command">${X(fieldCmd(url))}</hp:stringParam><hp:stringParam name="Path">${X(url)}</hp:stringParam><hp:stringParam name="Category">HWPHYPERLINK_TYPE_URL</hp:stringParam><hp:stringParam name="TargetType">HWPHYPERLINK_TARGET_BOOKMARK</hp:stringParam><hp:stringParam name="DocOpenType">HWPHYPERLINK_JUMP_CURRENTTAB</hp:stringParam></hp:parameters></hp:fieldBegin></hp:ctrl></hp:run>`;
        link.url = url;
      };
      const linkClose = () => { if (!link) return; close(); out += `<hp:run charPrIDRef="${C.charPr(lastStyle || {})}"><hp:ctrl><hp:fieldEnd beginIDRef="${link.bid}" fieldid="${link.fid}"/></hp:ctrl></hp:run>`; link = null; };
      for (const r of runs) {
        const want = r.text !== undefined ? (r.link || null) : (link ? link.url : null);
        if (link && want !== link.url) linkClose();
        if (!link && want) linkOpen(want);
        if (r.img) { close(); out += `<hp:run charPrIDRef="${C.charPr(lastStyle || {})}">${await C.picXml(r.img.src, r.img.w, r.img.h, { inline: true })}</hp:run>`; continue; }
        if (r.obj) { close(); out += `<hp:run charPrIDRef="${C.charPr(lastStyle || {})}">${await C.objXml(r.obj)}</hp:run>`; continue; }
        if (r.fn) {
          close(); fnNo++;
          const txt = X(r.fn);
          out += `<hp:run charPrIDRef="${C.charPr(lastStyle || {})}"><hp:ctrl><hp:footNote number="${fnNo}" suffixChar="41" instId="${C.nextId()}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="TOP" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0"><hp:p paraPrIDRef="10" styleIDRef="15" pageBreak="0" columnBreak="0" merged="0" id="${C.nextPara()}"><hp:run charPrIDRef="3"><hp:ctrl><hp:autoNum num="${fnNo}" numType="FOOTNOTE"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/></hp:autoNum></hp:ctrl><hp:t> ${txt}</hp:t></hp:run></hp:p></hp:subList></hp:footNote></hp:ctrl></hp:run>`;
          continue;
        }
        let id, piece;
        if (r.br) { id = cur !== null ? cur : C.charPr(lastStyle || {}); piece = '<hp:lineBreak/>'; }
        else if (r.tab) { id = cur !== null ? cur : C.charPr(lastStyle || {}); piece = '<hp:tab/>'; }
        else { lastStyle = r; id = C.charPr(r); piece = X(r.text); }
        if (id !== cur) { close(); cur = id; }
        buf += piece;
      }
      close(); linkClose();
      if (!out) out = `<hp:run charPrIDRef="${C.charPr(fallbackStyle || {})}"><hp:t/></hp:run>`;
      return out;
    };
    const styleOf = (b) => (b.runs && b.runs.find((r) => r.text)) || { size: 10 };
    C.tableXml = async (tb) => {
      const total = Math.min(C.textWidth, Math.round(tb.colW.reduce((a, c) => a + c, 0) * HU));
      const sum = tb.colW.reduce((a, c) => a + c, 0) || 1;
      const colHU = tb.colW.map((c) => Math.max(200, Math.round(c / sum * total)));
      const rowHU = (tb.rowH || []).map((h) => Math.max(282, Math.round(h * HU)));
      const tblH = rowHU.reduce((a, b) => a + b, 0) || 282 * tb.rows.length;
      const tbf = C.borderFill(tb.border, null);
      const oid = C.nextId();
      let x = `<hp:tbl id="${oid}" zOrder="${C.nextZ()}" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${tb.nrows}" colCnt="${tb.cols}" cellSpacing="0" borderFillIDRef="${tbf}" noAdjust="0">`;
      x += `<hp:sz width="${colHU.reduce((a, b) => a + b, 0)}" widthRelTo="ABSOLUTE" height="${tblH}" heightRelTo="ABSOLUTE" protect="0"/>`;
      x += `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="${tb.align === 'center' ? 'CENTER' : 'LEFT'}" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="141" bottom="141"/>`;
      for (let ri = 0; ri < tb.rows.length; ri++) {
        x += '<hp:tr>';
        for (const cell of tb.rows[ri]) {
          const w = colHU.slice(cell.c, cell.c + cell.cs).reduce((a, b) => a + b, 0);
          const h = rowHU.slice(cell.r, cell.r + cell.rs).reduce((a, b) => a + b, 0) || 282;
          const bf = C.borderFill(cell.border, cell.bg);
          let inner = '';
          for (const b of cell.blocks) inner += await C.blockXml(b);
          x += `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${cell.va || 'CENTER'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${inner}</hp:subList><hp:cellAddr colAddr="${cell.c}" rowAddr="${cell.r}"/><hp:cellSpan colSpan="${cell.cs}" rowSpan="${cell.rs}"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="510" right="510" top="141" bottom="141"/></hp:tc>`;
        }
        x += '</hp:tr>';
      }
      return x + '</hp:tbl>';
    };
    C.blockXml = async (b, secRun) => {
      const pid = C.nextPara();
      if (b.t === 'table') {
        const pp = C.paraPr({ align: b.align === 'center' ? 'center' : 'left', lh: 160 });
        return `<hp:p id="${pid}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${b.pb ? 1 : 0}" columnBreak="0" merged="0">${secRun || ''}<hp:run charPrIDRef="${C.charPr({ size: 10 })}">${await C.tableXml(b)}</hp:run></hp:p>`;
      }
      const pp = C.paraPr(b);
      const runs = await C.runsXml(b.runs || [], styleOf(b));
      return `<hp:p id="${pid}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${b.pb ? 1 : 0}" columnBreak="0" merged="0">${secRun || ''}${runs}</hp:p>`;
    };

    /* ----- 구역(용지·머리말·꼬리말) ----- */
    C.secRun = (hf) => {
      const sec = C.sec;
      const i0 = sec.indexOf('<hp:run charPrIDRef="0"><hp:secPr');
      const i1 = sec.indexOf('</hp:run>', sec.indexOf('</hp:ctrl>'));
      let run = sec.slice(i0, i1);
      const pw = Math.round(Math.min(page.w, page.h) * MM), ph = Math.round(Math.max(page.w, page.h) * MM);
      run = run.replace(/<hp:pagePr [^>]*>/, `<hp:pagePr landscape="${page.landscape ? 'NARROWLY' : 'WIDELY'}" width="${pw}" height="${ph}" gutterType="LEFT_ONLY">`)
        .replace(/<hp:margin [^>]*\/>/, `<hp:margin header="${Math.round(page.hd * MM)}" footer="${Math.round(page.ft * MM)}" gutter="0" left="${Math.round(page.ml * MM)}" right="${Math.round(page.mr * MM)}" top="${Math.round(page.mt * MM)}" bottom="${Math.round(page.mb * MM)}"/>`);
      return run + (hf ? C.headerFooterXml(hf) : '') + '</hp:run>';
    };
    C.headerFooterXml = (hf) => {
      const pn = hf.pnum && hf.pnum.pos && hf.pnum.pos !== 'none' ? hf.pnum : null;
      const zone = (which) => {
        const z = hf[which] || {}; const paras = [];
        const st = { size: z.size || 9, color: z.color || '#333333', font: z.font || '' };
        if (z.text) paras.push(`<hp:p paraPrIDRef="${C.paraPr({ align: z.align || 'center', lh: 160 })}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0" id="${C.nextPara()}"><hp:run charPrIDRef="${C.charPr(st)}"><hp:t>${X(z.text)}</hp:t></hp:run></hp:p>`);
        if (pn && pn.pos.startsWith(which === 'header' ? 'top' : 'bottom')) {
          const al = pn.pos.split('-')[1] || 'center'; const cp = C.charPr(st);
          const num = (type) => `<hp:run charPrIDRef="${cp}"><hp:ctrl><hp:autoNum num="1" numType="${type}"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar="" supscript="0"/></hp:autoNum></hp:ctrl></hp:run>`;
          const t = (s) => (s ? `<hp:run charPrIDRef="${cp}"><hp:t>${X(s)}</hp:t></hp:run>` : '');
          const f = pn.fmt || 'n';
          const body = f === 'dash' ? t('- ') + num('PAGE') + t(' -') : f === 'total' ? num('PAGE') + t(' / ') + num('TOTAL_PAGE') : f === 'jjok' ? num('PAGE') + t('쪽') : num('PAGE');
          paras.push(`<hp:p paraPrIDRef="${C.paraPr({ align: al, lh: 160 })}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0" id="${C.nextPara()}">${body}</hp:p>`);
        }
        if (!paras.length) return '';
        const h = Math.round((which === 'header' ? page.hd : page.ft) * MM);
        return `<hp:ctrl><hp:${which} id="${C.nextId()}" applyPageType="BOTH"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${which === 'header' ? 'TOP' : 'BOTTOM'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="${C.textWidth}" textHeight="${h}" hasTextRef="0" hasNumRef="0">${paras.join('')}</hp:subList></hp:${which}></hp:ctrl>`;
      };
      return zone('header') + zone('footer');
    };

    /* ----- 마무리: header.xml 갱신 + 압축 ----- */
    C.finish = async (bodyXml, plain) => {
      const secHead = C.sec.slice(0, C.sec.indexOf('<hp:p '));
      files['Contents/section0.xml'] = secHead + bodyXml + '</hs:sec>';
      let header = C.header;
      if (newFonts.length) {
        header = header.replace(fontfaceRe, (m, lang, cnt, inner) => {
          const add = newFonts.map((n, k) => `<hh:font id="${+cnt + k}" face="${X(n)}" type="TTF" isEmbedded="0"/>`).join('');
          return `<hh:fontface lang="${lang}" fontCnt="${+cnt + newFonts.length}">${inner}${add}</hh:fontface>`;
        });
      }
      if (bfList.length) header = header.replace(/<hh:borderFills itemCnt="(\d+)">([\s\S]*?)<\/hh:borderFills>/, (m, c, inner) => `<hh:borderFills itemCnt="${+c + bfList.length}">${inner}${bfList.join('')}</hh:borderFills>`);
      header = header.replace(/<hh:charProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:charProperties>/, (m, c, inner) => `<hh:charProperties itemCnt="${+c + charList.length}">${inner}${charList.join('')}</hh:charProperties>`);
      header = header.replace(/<hh:paraProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:paraProperties>/, (m, c, inner) => `<hh:paraProperties itemCnt="${+c + paraList.length}">${inner}${paraList.join('')}</hh:paraProperties>`);
      files['Contents/header.xml'] = header;
      let hpf = files['Contents/content.hpf'];
      const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
      hpf = hpf.replace(/<opf:title\/>|<opf:title>[^<]*<\/opf:title>/, `<opf:title>${X(meta.title || '')}</opf:title>`)
        .replace(/(<opf:meta name="creator" content="text">)[^<]*/, `$1${X(meta.author || '')}`)
        .replace(/(<opf:meta name="lastsaveby" content="text">)[^<]*/, `$1${X(meta.author || '')}`)
        .replace(/(<opf:meta name="CreatedDate" content="text">)[^<]*/, `$1${now}`)
        .replace(/(<opf:meta name="ModifiedDate" content="text">)[^<]*/, `$1${now}`)
        .replace(/(<opf:meta name="date" content="text">)[^<]*/, `$1${X(new Date().toLocaleString('ko-KR'))}`);
      if (bins.length) hpf = hpf.replace('</opf:manifest>', bins.map((b) => `<opf:item id="${b.id}" href="${b.name}" media-type="${b.mime}" isEmbeded="1"/>`).join('') + '</opf:manifest>');
      files['Contents/content.hpf'] = hpf;
      files['Preview/PrvText.txt'] = (plain || '').slice(0, 1024) || ' ';
      const zip = new JSZip();
      zip.file('mimetype', 'application/hwp+zip', { compression: 'STORE' });
      const order = ['version.xml', 'Contents/header.xml', 'Contents/section0.xml', 'Preview/PrvText.txt', 'settings.xml', 'Preview/PrvImage.png', 'META-INF/container.rdf', 'Contents/content.hpf', 'META-INF/container.xml', 'META-INF/manifest.xml'];
      for (const n of order) if (files[n] !== undefined) zip.file(n, files[n], { compression: n === 'version.xml' || n.endsWith('.png') ? 'STORE' : 'DEFLATE' });
      for (const b of bins) zip.file(b.name, b.bytes, { compression: 'STORE' });
      return zip.generateAsync({ type: 'uint8array', mimeType: 'application/hwp+zip', compression: 'DEFLATE' });
    };
    return C;
  }

  /* ---------- 한글 문서 ---------- */
  async function build(blocks, page, meta = {}, extras = {}) {
    const C = await context(page, meta);
    const list = blocks.length ? blocks : [{ t: 'p', align: 'justify', lh: 160, runs: [] }];
    let body = '';
    const first = C.secRun(extras.hf);
    for (let k = 0; k < list.length; k++) body += await C.blockXml(list[k], k === 0 ? first : '');
    return C.finish(body, DocModel.plainText(blocks));
  }

  /* ---------- 디자인 프로젝트 ----------
   * objectsPerPage: [[{kind:'pic'|'box'|'line', ...종이 기준 px 좌표}...], ...]
   */
  async function buildDesign(objectsPerPage, size, meta = {}) {
    const page = { w: size.w / PXMM, h: size.h / PXMM, landscape: size.w > size.h, ml: 0, mr: 0, mt: 0, mb: 0, hd: 0, ft: 0 };
    const C = await context(page, meta);

      let runs = '';

      runs += `<hp:run charPrIDRef="${C.charPr({ size: 1 })}"><hp:t/></hp:run>`;
      body += `<hp:p id="${C.nextPara()}" paraPrIDRef="${C.paraPr({ align: 'left', lh: 100 })}" styleIDRef="0" pageBreak="${k > 0 ? 1 : 0}" columnBreak="0" merged="0">${k === 0 ? C.secRun(null) : ''}${runs}</hp:p>`;
    }
    return C.finish(body, meta.plain || '');
  }

  return { build, buildDesign, dataUrlToImage };
})();

/* ===== 내보내기: DOCX · Markdown · TXT · HTML · PDF · PNG ===== */
const DOCXWriter = (() => {
  const X = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const TW = 15; // 1px = 15 twip
  const EMU = 9525;

  async function build(blocks, page, meta = {}, extras = {}) {
    const media = []; let docPrId = 1;
    const links = []; const notes = [];
    const textW = Math.round((page.w - page.ml - page.mr) * 56.693);

    async function imgRun(r) {
      let mime = '', bytes;
      const m = /^data:([^;,]+);base64,(.*)$/s.exec(r.img.src || '');
      if (m) { mime = m[1]; const s = atob(m[2]); bytes = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i); }
      else { try { const b = await (await fetch(r.img.src)).blob(); mime = b.type; bytes = new Uint8Array(await b.arrayBuffer()); } catch (e) { return ''; } }
      let ext = { 'image/png': 'png', 'image/jpeg': 'jpeg', 'image/gif': 'gif', 'image/bmp': 'bmp' }[mime];
      if (!ext) {
        const conv = await HWPXWriterImage(r.img.src); if (!conv) return '';
        bytes = conv; ext = 'png';
      }
      const n = media.length + 1; const rid = 'rIdImg' + n;
      media.push({ name: `image${n}.${ext}`, bytes, rid });
      let cx = Math.round(r.img.w * EMU), cy = Math.round(r.img.h * EMU);
      const maxCx = textW * 635; if (cx > maxCx) { cy = Math.round(cy * maxCx / cx); cx = maxCx; }
      const id = docPrId++;
      return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="그림 ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="image${n}.${ext}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
    }

    function rPr(r) {
      let x = '';
      if (r.font) x += `<w:rFonts w:ascii="${X(r.font)}" w:hAnsi="${X(r.font)}" w:eastAsia="${X(r.font)}" w:cs="${X(r.font)}"/>`;
      if (r.b) x += '<w:b/><w:bCs/>';
      if (r.i) x += '<w:i/><w:iCs/>';
      if (r.s) x += '<w:strike/>';
      if (r.color) x += `<w:color w:val="${r.color.replace('#', '')}"/>`;
      if (r.size) x += `<w:sz w:val="${Math.round(r.size * 2)}"/><w:szCs w:val="${Math.round(r.size * 2)}"/>`;
      if (r.u) x += '<w:u w:val="single"/>';
      if (r.bg) x += `<w:shd w:val="clear" w:color="auto" w:fill="${r.bg.replace('#', '')}"/>`;
      if (r.sup) x += '<w:vertAlign w:val="superscript"/>'; else if (r.sub) x += '<w:vertAlign w:val="subscript"/>';
      return x ? `<w:rPr>${x}</w:rPr>` : '';
    }

    async function para(b) {
      let p = '<w:p><w:pPr>';
      if (b.pb) p += '<w:pageBreakBefore/>';
      p += `<w:spacing w:before="${Math.round((b.mt || 0) * TW)}" w:after="${Math.round((b.mb || 0) * TW)}" w:line="${Math.round((b.lh || 160) / 100 * 240 * 0.85)}" w:lineRule="auto"/>`;
      const ti = Math.round((b.ti || 0) * TW);
      if (b.ml || b.mr || ti) p += `<w:ind w:left="${Math.round((b.ml || 0) * TW)}" w:right="${Math.round((b.mr || 0) * TW)}"${ti >= 0 ? ` w:firstLine="${ti}"` : ` w:hanging="${-ti}"`}/>`;
      p += `<w:jc w:val="${({ left: 'left', right: 'right', center: 'center', justify: 'both' })[b.align] || 'both'}"/>`;
      const first = (b.runs || []).find((r) => r.text);
      if (first) p += rPr(first).replace('w:rPr>', 'w:rPr>').replace(/^<w:rPr>/, '<w:rPr>');
      p += '</w:pPr>';
      let last = first || {};
      const after = [];
      for (const r of b.runs || []) {
        if (r.img) p += await imgRun(r);
        else if (r.obj && r.obj.kind === 'pic') p += await imgRun({ img: { src: r.obj.src, w: r.obj.w, h: r.obj.h } });
        else if (r.obj && r.obj.blocks) { for (const ib of r.obj.blocks) after.push(ib); }
        else if (r.obj) { /* 선 개체는 Word 흐름 문서에서 생략 */ }
        else if (r.fn !== undefined) { notes.push(r.fn); p += `<w:r>${rPr(Object.assign({}, last, { sup: 1 }))}<w:t>${notes.length})</w:t></w:r>`; }
        else if (r.br) p += `<w:r>${rPr(last)}<w:br/></w:r>`;
        else if (r.tab) p += `<w:r>${rPr(last)}<w:tab/></w:r>`;
        else if (r.link) {
          last = r; let id = links.findIndex((l) => l === r.link); if (id < 0) { links.push(r.link); id = links.length - 1; }
          p += `<w:hyperlink r:id="rIdLink${id + 1}"><w:r>${rPr(r)}<w:t xml:space="preserve">${X(r.text)}</w:t></w:r></w:hyperlink>`;
        } else { last = r; p += `<w:r>${rPr(r)}<w:t xml:space="preserve">${X(r.text)}</w:t></w:r>`; }
      }
      p += '</w:p>';
      for (const ib of after) p += await block(ib);
      return p;
    }

    async function table(tb) {
      const sum = tb.colW.reduce((a, c) => a + c, 0) || 1;
      const totalTw = Math.min(textW, Math.round(sum * TW));
      const colTw = tb.colW.map((c) => Math.max(100, Math.round(c / sum * totalTw)));
      const bstyle = tb.border ? 'single' : 'nil';
      const brd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((s) => `<w:${s} w:val="${bstyle}" w:sz="4" w:space="0" w:color="000000"/>`).join('');
      let x = `<w:tbl><w:tblPr><w:tblW w:w="${colTw.reduce((a, b) => a + b, 0)}" w:type="dxa"/>${tb.align === 'center' ? '<w:jc w:val="center"/>' : ''}<w:tblBorders>${brd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${colTw.map((w) => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
      // 세로 병합 계산
      const covered = {}; // "r,c" -> {cs, owner}
      for (const row of tb.rows) for (const cell of row) for (let y = 1; y < cell.rs; y++) covered[(cell.r + y) + ',' + cell.c] = cell;
      for (let ri = 0; ri < tb.nrows; ri++) {
        const row = tb.rows[ri] || [];
        const h = tb.rowH && tb.rowH[ri] ? Math.round(tb.rowH[ri] * TW) : 0;
        x += '<w:tr>' + (h ? `<w:trPr><w:trHeight w:val="${h}"/></w:trPr>` : '');
        // 행의 칸을 열 순서대로 (원본 칸 + 세로병합 이어짐 칸)
        const items = row.map((c) => ({ c: c.c, cell: c, cont: false }));
        for (const key in covered) { const [r, c] = key.split(',').map(Number); if (r === ri) items.push({ c, cell: covered[key], cont: true }); }
        items.sort((a, b) => a.c - b.c);
        for (const it of items) {
          const cell = it.cell;
          const w = colTw.slice(cell.c, cell.c + cell.cs).reduce((a, b) => a + b, 0);
          let tcPr = `<w:tcW w:w="${w}" w:type="dxa"/>`;
          if (cell.cs > 1) tcPr += `<w:gridSpan w:val="${cell.cs}"/>`;
          if (cell.rs > 1) tcPr += it.cont ? '<w:vMerge/>' : '<w:vMerge w:val="restart"/>';
          if (cell.bg) tcPr += `<w:shd w:val="clear" w:color="auto" w:fill="${cell.bg.replace('#', '')}"/>`;
          tcPr += `<w:vAlign w:val="${({ TOP: 'top', BOTTOM: 'bottom' })[cell.va] || 'center'}"/>`;
          let inner = '';
          if (!it.cont) for (const b of cell.blocks) inner += await block(b);
          if (!inner.endsWith('</w:p>')) inner += '<w:p/>';
          x += `<w:tc><w:tcPr>${tcPr}</w:tcPr>${inner}</w:tc>`;
        }
        x += '</w:tr>';
      }
      return x + '</w:tbl>';
    }

    async function block(b) {
      if (b.t === 'table') return (b.pb ? '<w:p><w:r><w:br w:type="page"/></w:r></w:p>' : '') + await table(b);
      return para(b);
    }

    let body = '';
    for (const b of blocks) body += await block(b);
    if (notes.length) {
      body += `<w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="999999"/></w:pBdr><w:spacing w:before="240"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="18"/></w:rPr><w:t>각주</w:t></w:r></w:p>`;
      notes.forEach((t, i) => { body += `<w:p><w:r><w:rPr><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${i + 1}) ${X(t)}</w:t></w:r></w:p>`; });
    }
    if (!body.endsWith('</w:p>')) body += '<w:p/>';
    const hf = extras.hf || null;
    const hfPart = (which) => {
      const z = hf && hf[which]; const pn = hf && hf.pnum && hf.pnum.pos && hf.pnum.pos.startsWith(which === 'header' ? 'top' : 'bottom') ? hf.pnum : null;
      if (!(z && z.text) && !pn) return null;
      const jc = (a) => ({ left: 'left', right: 'right', center: 'center' })[a] || 'center';
      let x = '';
      if (z && z.text) x += `<w:p><w:pPr><w:jc w:val="${jc(z.align)}"/></w:pPr><w:r><w:rPr><w:sz w:val="18"/><w:color w:val="333333"/></w:rPr><w:t xml:space="preserve">${X(z.text)}</w:t></w:r></w:p>`;
      if (pn) {
        const fld = (code) => `<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> ${code} </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`;
        const t = (s) => `<w:r><w:t xml:space="preserve">${X(s)}</w:t></w:r>`;
        const inner = pn.fmt === 'dash' ? t('- ') + fld('PAGE') + t(' -') : pn.fmt === 'total' ? fld('PAGE') + t(' / ') + fld('NUMPAGES') : pn.fmt === 'jjok' ? fld('PAGE') + t('쪽') : fld('PAGE');
        x += `<w:p><w:pPr><w:jc w:val="${jc(pn.pos.split('-')[1])}"/></w:pPr>${inner}</w:p>`;
      }
      const tag = which === 'header' ? 'hdr' : 'ftr';
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:${tag} xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${x}</w:${tag}>`;
    };
    const hdrXml = hfPart('header'), ftrXml = hfPart('footer');
    const pw = Math.round(page.w * 56.693), ph = Math.round(page.h * 56.693);
    const sect = `<w:sectPr>${hdrXml ? '<w:headerReference w:type="default" r:id="rIdHdr"/>' : ''}${ftrXml ? '<w:footerReference w:type="default" r:id="rIdFtr"/>' : ''}<w:pgSz w:w="${pw}" w:h="${ph}"${page.landscape ? ' w:orient="landscape"' : ''}/><w:pgMar w:top="${Math.round((page.mt + page.hd) * 56.693)}" w:right="${Math.round(page.mr * 56.693)}" w:bottom="${Math.round((page.mb + page.ft) * 56.693)}" w:left="${Math.round(page.ml * 56.693)}" w:header="${Math.round(page.mt * 56.693)}" w:footer="${Math.round(page.mb * 56.693)}" w:gutter="0"/></w:sectPr>`;
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}${sect}</w:body></w:document>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕" w:cs="맑은 고딕"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="en-US" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
    const exts = [...new Set(media.map((m) => m.name.split('.').pop()))];
    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${exts.map((e) => `<Default Extension="${e}" ContentType="image/${e}"/>`).join('')}<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>${hdrXml ? '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>' : ''}${ftrXml ? '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' : ''}</Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
    const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${media.map((m) => `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join('')}${links.map((u, i) => `<Relationship Id="rIdLink${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${X(u)}" TargetMode="External"/>`).join('')}${hdrXml ? '<Relationship Id="rIdHdr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/>' : ''}${ftrXml ? '<Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>' : ''}</Relationships>`;
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(meta.title || '')}</dc:title><dc:creator>${X(meta.author || '')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;

  }

  async function HWPXWriterImage(src) {
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
      const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;

      const b = await new Promise((r) => cv.toBlob(r, 'image/png'));
      return new Uint8Array(await b.arrayBuffer());
    } catch (e) { return null; }
  }

  return { build };
})();

const TextExport = (() => {
  function md(blocks) {
    const out = []; const notes = []; const extra = [];
    const inline = (runs) => {
      let s = '';
      for (const r of runs) {
        if (r.br) { s += '  \n'; continue; }
        if (r.tab) { s += '\t'; continue; }
        if (r.img) { s += `![그림](${r.img.src})`; continue; }
        if (r.obj) { if (r.obj.kind === 'pic') s += `![그림](${r.obj.src})`; else if (r.obj.blocks) extra.push(...r.obj.blocks); continue; }
        if (r.fn !== undefined) { notes.push(r.fn); s += `[^${notes.length}]`; continue; }
        if (r.text === undefined) continue;
        let t = r.text.replace(/([*_`\[\]\\|#])/g, '\\$1');
        const lead = t.match(/^\s*/)[0], trail = t.match(/\s*$/)[0];
        let core = t.trim();
        if (!core) { s += t; continue; }
        if (r.s) core = `~~${core}~~`;
        if (r.i) core = `*${core}*`;
        if (r.b) core = `**${core}**`;
        if (r.link) core = `[${core}](${r.link})`;
        s += lead + core + trail;
      }
      return s;
    };
    for (const b of blocks) {
      if (b.t === 'table') {
        const grid = Array.from({ length: b.nrows }, () => new Array(b.cols).fill(''));
        for (const row of b.rows) for (const c of row) grid[c.r][c.c] = c.blocks.map((x) => x.t === 'p' ? inline(x.runs) : '[표]').join('<br>').replace(/\n/g, ' ');
        out.push('');
        grid.forEach((row, i) => {
          out.push('| ' + row.map((v) => v || ' ').join(' | ') + ' |');
          if (i === 0) out.push('|' + row.map(() => ' --- ').join('|') + '|');
        });
        out.push('');
        continue;
      }
      let line = inline(b.runs);
      while (extra.length) { const eb = extra.shift(); if (eb.t === 'p') { out.push(inline(eb.runs)); out.push(''); } }
      const tag = b.tag || '';
      if (/^H[1-6]$/.test(tag)) line = '#'.repeat(+tag[1]) + ' ' + line.replace(/^\*\*(.*)\*\*$/, '$1');
      else if (b.align === 'center' && line.trim()) line = line; // 마크다운은 정렬 미지원
      out.push(line);
      out.push('');
    }
    if (notes.length) { out.push(''); notes.forEach((t, i) => out.push(`[^${i + 1}]: ${t}`)); }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  return { md, txt: (blocks) => DocModel.plainText(blocks) + '\n' };
})();

const PageRender = (() => {
  // 문서를 용지 크기로 잘라 캔버스 페이지 목록을 만든다 (PDF·PNG 공용)
  async function pages(srcEl, page, scale = 2, opts = {}) {
    await Loader.need('html2canvas');
    const pxPerMm = 96 / 25.4;
    const pw = page.w * pxPerMm, ph = page.h * pxPerMm;
    const top = (page.mt + page.hd) * pxPerMm, bottom = (page.mb + page.ft) * pxPerMm;
    const contentH = ph - top - bottom;
    const holder = document.createElement('div');
    holder.style.cssText = `position:fixed;left:-100000px;top:0;width:${pw}px;background:#fff;`;
    const clone = srcEl.cloneNode(true);
    clone.removeAttribute('contenteditable');
    clone.id = 'renderClone';
    clone.style.cssText = `width:${pw}px;min-height:0;padding:0 ${page.mr * pxPerMm}px 0 ${page.ml * pxPerMm}px;margin:0;box-shadow:none;border:0;background:#fff;`;
    clone.querySelectorAll('.page-marker').forEach((m) => m.remove());
    clone.querySelectorAll('.tbox').forEach((t) => t.removeAttribute('contenteditable'));
    if (opts.fnList && !opts.fnList.hidden) { const fl = opts.fnList.cloneNode(true); fl.removeAttribute('id'); fl.style.width = 'auto'; fl.querySelectorAll('button').forEach((b) => { const d = document.createElement('div'); d.textContent = b.textContent; b.replaceWith(d); }); clone.appendChild(fl); }
    holder.appendChild(clone); document.body.appendChild(holder);
    try {
      // 페이지 경계 후보: 블록·표 행·그림의 아래쪽
      const base = clone.getBoundingClientRect().top;
      const cands = new Set();
      const forced = [];
      clone.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,tr,img,div.textbox,pre,blockquote').forEach((el) => {
        const r = el.getBoundingClientRect(); cands.add(Math.round(r.bottom - base));
      });
      const after = {};
      clone.querySelectorAll('.pagebreak').forEach((el) => { const r = el.getBoundingClientRect(); const t = Math.round(r.top - base); forced.push(t); after[t] = Math.round(r.bottom - base + (parseFloat(getComputedStyle(el).marginBottom) || 0)); });
      const sorted = [...cands].sort((a, b) => a - b);
      const total = clone.scrollHeight;
      const cuts = []; let start = 0;
      while (start < total - 2) {
        let limit = start + contentH;
        const f = forced.find((y) => y > start + 1 && y <= limit);
        let end;
        if (f !== undefined) end = f;
        else if (limit >= total) end = total;
        else {
          const ok = sorted.filter((y) => y > start + 20 && y <= limit);
          end = ok.length ? ok[ok.length - 1] : limit;
        }
        cuts.push([start, end]);
        start = end;
        if (f !== undefined) start = Math.max(f + 1, after[f] || 0);
      }
      if (!cuts.length) cuts.push([0, Math.max(1, total)]);
      const canvas = await html2canvas(clone, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: pw + 40 });
      const k = canvas.width / clone.offsetWidth;
      const out = [];
      for (const [a, b] of cuts) {
        const pc = document.createElement('canvas');
        pc.width = Math.round(pw * k); pc.height = Math.round(ph * k);
        const g = pc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pc.width, pc.height);
        const h = Math.min(b - a, contentH);
        g.drawImage(canvas, 0, Math.round(a * k), canvas.width, Math.round(h * k), 0, Math.round(top * k), canvas.width, Math.round(h * k));
        out.push(pc);
      }
      drawHeaderFooter(out, page, opts.hf, k);
      return out;
    } finally { holder.remove(); }
  }

  // 쪽마다 머리말·꼬리말·쪽 번호 그리기
  function drawHeaderFooter(cvs, page, hf, k) {
    if (!hf) return;
    const mm = (v) => v * 96 / 25.4 * k;
    const N = cvs.length;
    cvs.forEach((c, i) => {
      const g = c.getContext('2d');
      g.fillStyle = '#333333'; g.font = `${Math.round(12 * k)}px "함초롬바탕", "Noto Serif KR", serif`; g.textBaseline = 'top';
      const left = mm(page.ml), right = c.width - mm(page.mr), mid = (left + right) / 2;
      const put = (t, align, y) => { g.textAlign = align === 'left' ? 'left' : align === 'right' ? 'right' : 'center'; g.fillText(t, align === 'left' ? left : align === 'right' ? right : mid, y); };
      const hy = mm(page.mt), fy = c.height - mm(page.mb) - 16 * k;
      if (hf.header && hf.header.text) put(hf.header.text, hf.header.align, hy);
      if (hf.footer && hf.footer.text) put(hf.footer.text, hf.footer.align, fy - (hf.pnum && hf.pnum.pos && hf.pnum.pos.startsWith('bottom') ? 16 * k : 0));
      if (hf.pnum && hf.pnum.pos && hf.pnum.pos !== 'none') {
        const [v, a] = hf.pnum.pos.split('-'); const n = i + 1;
        const t = ({ dash: `- ${n} -`, total: `${n} / ${N}`, jjok: `${n}쪽` })[hf.pnum.fmt] || String(n);
        put(t, a, v === 'top' ? hy + (hf.header && hf.header.text ? 16 * k : 0) : fy);
      }
    });
  }
  async function pdf(srcEl, page, opts = {}) {
    await Loader.need('jspdf');
    const cvs = await pages(srcEl, page, 2, opts);
    const { jsPDF } = window.jspdf;
    const w = Math.min(page.w, page.h), h = Math.max(page.w, page.h);
    const orient = page.landscape ? 'l' : 'p';
    const doc = new jsPDF({ orientation: orient, unit: 'mm', format: [w, h], compress: true });
    cvs.forEach((c, i) => {
      if (i) doc.addPage([w, h], orient);
      doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, page.w, page.h, undefined, 'FAST');
    });
    return new Uint8Array(doc.output('arraybuffer'));
  }

  async function png(srcEl, page, opts = {}) {
    const cvs = await pages(srcEl, page, 2, opts);
    const type = opts.type === 'jpg' ? 'jpg' : 'png';
    const blobs = await Promise.all(cvs.map((c) => new Promise((r) => c.toBlob(r, type === 'jpg' ? 'image/jpeg' : 'image/png', 0.92))));
    if (blobs.length === 1) return { single: new Uint8Array(await blobs[0].arrayBuffer()) };
    const zip = new JSZip();
    for (let i = 0; i < blobs.length; i++) zip.file(`${String(i + 1).padStart(2, '0')}쪽.${type}`, await blobs[i].arrayBuffer());
    return { zip: await zip.generateAsync({ type: 'uint8array' }) };
  }

  return { pdf, png };
})();

  /* ---------- 선택 상자 ---------- */
  function aabb(L) {

  function drawSel(guides) {

    let b;

    frame.style.left = b.x * z + 'px'; frame.style.top = b.y * z + 'px'; frame.style.width = b.w * z + 'px'; frame.style.height = b.h * z + 'px';
    if (!S.editing && !(one && one.locked)) {

    }

    box.appendChild(frame);
    if (one && (one.rot || 0) !== 0 && !S.editing) { const t = document.createElement('div'); t.className = 'dtip'; t.textContent = Math.round(one.rot) + '°'; t.style.left = (b.x + b.w / 2) * z + 'px'; t.style.top = (b.y + b.h) * z + 14 + 'px'; box.appendChild(t); }
  }

  /* ---------- 포인터: 이동·크기·회전·영역 선택 ---------- */
  let drag = null;
  function pagePoint(e) { const r = $('#dWrap').getBoundingClientRect(); const z = r.width / S.project.w; return { x: (e.clientX - r.left) / z, y: (e.clientY - r.top) / z, z }; }
  function onDown(e) {
    if (e.button !== 0 || !S.project) return;

      const ed = layerNode(S.editing);

    }
    const p = pagePoint(e);
    if (h) {
      e.preventDefault();
      const ls = selLayers();

    if (node && $('#dWrap').contains(node)) {
      const id = node.dataset.id;
      if (e.shiftKey || e.ctrlKey || e.metaKey) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); }
      else if (!S.sel.has(id)) { S.sel.clear(); S.sel.add(id); }
      renderLayers(); renderProps(); drawSel();
      const ls = selLayers().filter((l) => !l.locked);
      if (ls.length) { e.preventDefault(); drag = { mode: 'move', start: p, orig: ls.map(clone), box: unionBox(ls), moved: false, alt: e.altKey }; $('#dStage').setPointerCapture(e.pointerId); }

  function snapMove(dx, dy, box, alt) {

    const xs = [0, S.project.w / 2, S.project.w], ys = [0, S.project.h / 2, S.project.h];
    others.forEach((b) => { xs.push(b.x, b.x + b.w / 2, b.x + b.w); ys.push(b.y, b.y + b.h / 2, b.y + b.h); });

      page().layers.forEach((L) => { if (L.hidden) return; const b = aabb(L); if (b.x < x2 && b.x + b.w > x1 && b.y < y2 && b.y + b.h > y1) S.sel.add(L.id); });

    }
    if (drag.mode === 'rot') {
      const o = drag.orig[0]; const L = layerById(o.id);
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      let a = Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90;
      if (e.shiftKey) a = Math.round(a / 15) * 15;
      else for (const t of [0, 90, 180, 270, 360, -90]) if (Math.abs(a - t) < 4) a = t;

      const corner = sx && sy;
      // 모서리: 그림은 비율 유지(Shift면 자유), 도형은 자유(Shift면 비율 유지), 글은 글자 크기까지 함께 키움

  function resizeMany(p) {

  /* ---------- 글 고치기 ---------- */
  function startEdit(id) {
    const L = layerById(id); if (!L || L.locked) return;

    if (L.type === 'shape' && !L.html) { L.html = '<p><br></p>'; }

        let html = cleanHtml(t.innerHTML);
        const empty = !t.textContent.trim() && !t.querySelector('img');
        if (L.type === 'shape' && empty) html = '';
        if (L.type === 'text' && empty) { page().layers = page().layers.filter((x) => x.id !== id); S.sel.delete(id); }

  function cleanHtml(html) {
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    const ok = new Set(['P', 'DIV', 'BR', 'SPAN', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'SUP', 'SUB', 'FONT', 'TABLE', 'TBODY', 'TR', 'TD', 'TH', 'COLGROUP', 'COL', 'UL', 'OL', 'LI', 'H1', 'H2', 'H3', 'IMG', 'A']);

  /* ---------- 레이어 추가 ---------- */
  function center(L) { L.x = Math.round((S.project.w - L.w) / 2); L.y = Math.round((S.project.h - L.h) / 2); return L; }

  /* ================= 디자인 → 문서 화면(HTML) ================= */

  /* ================= PPTX 내보내기 ================= */

        }

  async function toPptx(project, meta = {}) {
    await Loader.need('pptxgenjs');

    pptx.defineLayout({ name: 'HWPE', width: project.w / 96, height: project.h / 96 });
    pptx.layout = 'HWPE';

          }

  // 슬라이드 전환·등장 애니메이션을 PowerPoint 형식(p:transition, p:timing)으로 덧붙임

      const path = `ppt/slides/slide${i + 1}.xml`; const f = zip.file(path); if (!f) continue;
      let xml = await f.async('string');

      while ((m = re.exec(tree))) ids.push(+m[2]);

    const fade = (sp, ms, filter = 'fade') => `<p:animEffect transition="in" filter="${filter}"><p:cBhvr><p:cTn id="${nid()}" dur="${ms}"/>${tgt(sp)}</p:cBhvr></p:animEffect>`;
    const anim = (sp, ms, attr, from, to) => `<p:anim calcmode="lin" valueType="num"><p:cBhvr additive="base"><p:cTn id="${nid()}" dur="${ms}" fill="hold"/>${tgt(sp)}<p:attrNameLst><p:attrName>${attr}</p:attrName></p:attrNameLst></p:cBhvr><p:tavLst><p:tav tm="0"><p:val><p:strVal val="${from}"/></p:val></p:tav><p:tav tm="100000"><p:val><p:strVal val="${to}"/></p:val></p:tav></p:tavLst></p:anim>`;
    const effect = (L, nodeType, delay) => {
      const sp = spidOf.get(L.id); const ms = Math.round((L.anim.dur || 0.6) * 1000); const t = L.anim.in;
      let preset = 10, sub = 0, body;
      const ctn = nid();
      if (['up', 'down', 'left', 'right', 'drop'].includes(t)) {
        preset = 2; sub = ({ up: 4, down: 1, drop: 1, left: 8, right: 2 })[t];
        const from = { up: ['#ppt_x', '1+#ppt_h/2'], down: ['#ppt_x', '0-#ppt_h/2'], drop: ['#ppt_x', '0-#ppt_h/2'], left: ['0-#ppt_w/2', '#ppt_y'], right: ['1+#ppt_w/2', '#ppt_y'] }[t];
        body = setVis(sp) + anim(sp, ms, 'ppt_x', from[0], '#ppt_x') + anim(sp, ms, 'ppt_y', from[1], '#ppt_y');
      } else if (['zoomIn', 'zoomOut', 'pop', 'spin'].includes(t)) {
        preset = 53; sub = 16;
        body = setVis(sp) + anim(sp, ms, 'ppt_w', '0', '#ppt_w') + anim(sp, ms, 'ppt_h', '0', '#ppt_h') + fade(sp, ms);
      } else if (t === 'wipe' || t === 'wipeUp') {

    };
    const group = (items, first, auto) => {
      const outer = nid(), inner = nid();
      const cond = auto ? '<p:cond delay="indefinite"/><p:cond evt="onBegin" delay="0"><p:tn val="2"/></p:cond>' : '<p:cond delay="indefinite"/>';
      const effs = items.map((L, k) => effect(L, auto ? (k === 0 ? 'afterEffect' : 'withEffect') : 'clickEffect', ((L.anim.delay || 0)) * 1000)).join('');
      void first;
      return `<p:par><p:cTn id="${outer}" fill="hold"><p:stCondLst>${cond}</p:stCondLst><p:childTnLst><p:par><p:cTn id="${inner}" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst>${effs}</p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par>`;
    };
    let groups = '';
    if (A.length) groups += group(A, true, true);
    K.forEach((L) => { groups += group([L], false, false); });
    return `<p:timing><p:tnLst><p:par><p:cTn id="1" dur="indefinite" restart="never" nodeType="tmRoot"><p:childTnLst><p:seq concurrent="1" nextAc="seek"><p:cTn id="2" dur="indefinite" nodeType="mainSeq"><p:childTnLst>${groups}</p:childTnLst></p:cTn><p:prevCondLst><p:cond evt="onPrev" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:prevCondLst><p:nextCondLst><p:cond evt="onNext" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:nextCondLst></p:seq></p:childTnLst></p:cTn></p:par></p:tnLst></p:timing>`;
  }

  /* ================= PPTX 불러오기 ================= */
  async function fromPptx(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    const txt = async (p) => { const f = zip.file(p); return f ? f.async('string') : null; };
    const parse = (s) => new DOMParser().parseFromString(s, 'application/xml');
    const q = (el, name) => el ? Array.from(el.getElementsByTagNameNS('*', name)) : [];
    const kid = (el, name) => el ? Array.from(el.children).find((c) => c.localName === name) || null : null;
    const kids = (el, name) => el ? Array.from(el.children).filter((c) => c.localName === name) : [];
    const E = 9525;
    const pres = parse(await txt('ppt/presentation.xml') || '<x/>');
    const sz = q(pres, 'sldSz')[0];
    const W = sz ? Math.round(+sz.getAttribute('cx') / E) : 1280, H = sz ? Math.round(+sz.getAttribute('cy') / E) : 720;
    const relsOf = async (path) => {
      const dir = path.slice(0, path.lastIndexOf('/')); const name = path.slice(path.lastIndexOf('/') + 1);
      const r = await txt(`${dir}/_rels/${name}.rels`); const map = {};
      if (r) q(parse(r), 'Relationship').forEach((x) => { let t = x.getAttribute('Target'); if (x.getAttribute('TargetMode') === 'External') return; if (t.startsWith('/')) t = t.slice(1); else { const parts = (dir + '/' + t).split('/'); const st = []; parts.forEach((p) => { if (p === '..') st.pop(); else if (p !== '.') st.push(p); }); t = st.join('/'); } map[x.getAttribute('Id')] = t; });
      return map;
    };
    const presRels = await relsOf('ppt/presentation.xml');
    const slidePaths = q(pres, 'sldId').map((s) => presRels[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || s.getAttribute('r:id')]).filter(Boolean);
    // 테마 색
    const theme = {};
    const themePath = Object.keys(zip.files).find((n) => /^ppt\/theme\/theme\d+\.xml$/.test(n));
    if (themePath) {
      const t = parse(await txt(themePath)); const cs = q(t, 'clrScheme')[0];
      if (cs) Array.from(cs.children).forEach((c) => { const v = c.firstElementChild; if (!v) return; theme[c.localName] = '#' + (v.getAttribute('val') || v.getAttribute('lastClr') || '000000'); });
    }
    const schemeMap = { tx1: 'dk1', bg1: 'lt1', tx2: 'dk2', bg2: 'lt2' };
    const colorOf = (el) => {
      if (!el) return null;
      const s = kid(el, 'srgbClr'); if (s) return '#' + s.getAttribute('val');
      const sc = kid(el, 'schemeClr'); if (sc) { const k = sc.getAttribute('val'); return theme[schemeMap[k] || k] || null; }
      const sys = kid(el, 'sysClr'); if (sys) return '#' + (sys.getAttribute('lastClr') || '000000');
      return null;
    };
    const fillOf = (spPr) => { if (!spPr) return undefined; if (kid(spPr, 'noFill')) return ''; const sf = kid(spPr, 'solidFill'); return sf ? colorOf(sf) : undefined; };
    const assets = {}; let aid = 0;
    const media = async (path) => {
      const f = zip.file(path); if (!f) return null;
      const ext = path.split('.').pop().toLowerCase();
      const mime = ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', bmp: 'image/bmp', svg: 'image/svg+xml', webp: 'image/webp' })[ext];
      if (!mime) return null;
      const id = 'm' + (aid++); assets[id] = `data:${mime};base64,` + await f.async('base64'); return 'asset:' + id;
    };
    const xfrmOf = (spPr) => { const x = kid(spPr, 'xfrm'); if (!x) return null; const off = kid(x, 'off'), ext = kid(x, 'ext'); if (!off || !ext) return null; return { x: +off.getAttribute('x') / E, y: +off.getAttribute('y') / E, w: +ext.getAttribute('cx') / E, h: +ext.getAttribute('cy') / E, rot: (+x.getAttribute('rot') || 0) / 60000, flipH: x.getAttribute('flipH') === '1' }; };
    // 레이아웃·마스터의 자리표시자 위치
    const phCache = {};
    async function placeholders(path) {
      if (phCache[path]) return phCache[path];
      const out = {}; const x = await txt(path); if (!x) return (phCache[path] = out);
      const d = parse(x);
      q(d, 'sp').forEach((sp) => { const ph = q(sp, 'ph')[0]; const xf = xfrmOf(kid(sp, 'spPr')); if (ph && xf) { out['t:' + (ph.getAttribute('type') || 'body')] = xf; if (ph.getAttribute('idx')) out['i:' + ph.getAttribute('idx')] = xf; } });
      return (phCache[path] = out);
    }
    const PRST = { rect: 'rect', roundRect: 'roundrect', ellipse: 'ellipse', triangle: 'triangle', diamond: 'diamond', pentagon: 'pentagon', hexagon: 'hexagon', star5: 'star', heart: 'heart', rightArrow: 'arrow', wedgeRoundRectCallout: 'speech', wedgeRectCallout: 'speech', line: 'line', straightConnector1: 'line' };
    function textOf(txBody, defaults) {
      if (!txBody) return { html: '', size: 0 };
      const sizes = {}; let html = '';
      const lstSz = q(txBody, 'defRPr')[0];
      kids(txBody, 'p').forEach((p) => {
        const pPr = kid(p, 'pPr'); const algn = pPr && pPr.getAttribute('algn');
        const al = ({ ctr: 'center', r: 'right', just: 'justify', l: 'left' })[algn] || defaults.align;
        let inner = '';
        Array.from(p.children).forEach((r) => {
          if (r.localName === 'br') { inner += '<br>'; return; }
          if (r.localName !== 'r' && r.localName !== 'fld') return;
          const rPr = kid(r, 'rPr'); const t = (kid(r, 't') || {}).textContent || '';
          const st = [];
          const sz = rPr && rPr.getAttribute('sz') ? +rPr.getAttribute('sz') / 100 : (lstSz && lstSz.getAttribute('sz') ? +lstSz.getAttribute('sz') / 100 : defaults.pt);
          const px = Math.round(sz * 96 / 72 * 10) / 10; sizes[px] = (sizes[px] || 0) + t.length; st.push(`font-size:${px}px`);
          if (rPr) {
            if (rPr.getAttribute('b') === '1') st.push('font-weight:700');
            if (rPr.getAttribute('i') === '1') st.push('font-style:italic');
            if (rPr.getAttribute('u') && rPr.getAttribute('u') !== 'none') st.push('text-decoration:underline');
            const c = colorOf(kid(rPr, 'solidFill')); if (c) st.push('color:' + c);
            const lat = kid(rPr, 'ea') || kid(rPr, 'latin'); const tf = lat && lat.getAttribute('typeface');
            if (tf && !tf.startsWith('+')) st.push(`font-family:${Motion.fontCss(tf).replace(/"/g, "'")}`);
          }
          inner += `<span style="${st.join(';')}">${esc(t)}</span>`;
        });
        html += `<p style="text-align:${al}">${inner || '<br>'}</p>`;
      });
      const top = Object.entries(sizes).sort((a, b) => b[1] - a[1])[0];
      return { html, size: top ? +top[0] : defaults.pt * 96 / 72 };
    }
    const project = { v: 1, w: W, h: H, assets, pages: [] };
    for (const sp of slidePaths) {
      const x = await txt(sp); if (!x) continue;
      const d = parse(x); const rels = await relsOf(sp);
      const layoutPath = Object.values(rels).find((t) => /slideLayouts\//.test(t));
      const lph = layoutPath ? await placeholders(layoutPath) : {};
      let mph = {};
      if (layoutPath) { const lr = await relsOf(layoutPath); const mp = Object.values(lr).find((t) => /slideMasters\//.test(t)); if (mp) mph = await placeholders(mp); }
      const page = Design.newPage(); page.transition = { type: 'none', dur: 0.6 };
      const bg = q(d, 'bgPr')[0];
      if (bg) { const c = colorOf(kid(bg, 'solidFill')); if (c) page.bg = c; const blip = q(bg, 'blip')[0]; if (blip) { const p = rels[blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'embed')]; const a = p && await media(p); if (a) page.bgImage = a; } }
      if (q(d, 'transition')[0]) page.transition = { type: q(d, 'push')[0] ? 'slide' : q(d, 'cover')[0] ? 'cover' : q(d, 'zoom')[0] ? 'zoom' : 'fade', dur: 0.6 };
      const spMap = {};
      const walk = async (tree, tx) => {
        for (const el of Array.from(tree.children)) {
          const n = el.localName;
          const before = page.layers.length;
          const cnv = q(el, 'cNvPr')[0]; const spid = cnv ? cnv.getAttribute('id') : null;
          await one(el, n, tx);
          if (spid && page.layers.length > before) spMap[spid] = page.layers[page.layers.length - 1];
        }
      };
      const one = async (el, n, tx) => {
        {
          if (n === 'grpSp') {
            const gx = kid(kid(el, 'grpSpPr'), 'xfrm');
            let t2 = tx;
            if (gx) {
              const off = kid(gx, 'off'), ext = kid(gx, 'ext'), co = kid(gx, 'chOff'), ce = kid(gx, 'chExt');
              if (off && ext && co && ce) {
                const sx = (+ext.getAttribute('cx') || 1) / (+ce.getAttribute('cx') || 1), sy = (+ext.getAttribute('cy') || 1) / (+ce.getAttribute('cy') || 1);
                const ox = +off.getAttribute('x') - +co.getAttribute('x') * sx, oy = +off.getAttribute('y') - +co.getAttribute('y') * sy;
                t2 = { sx: tx.sx * sx, sy: tx.sy * sy, ox: tx.ox + ox / E * tx.sx, oy: tx.oy + oy / E * tx.sy };
              }
            }
            await walk(el, t2); return;
          }
          const apply = (b) => b && { x: tx.ox + b.x * tx.sx, y: tx.oy + b.y * tx.sy, w: b.w * tx.sx, h: b.h * tx.sy, rot: b.rot, flipH: b.flipH };
          if (n === 'sp' || n === 'cxnSp') {
            const spPr = kid(el, 'spPr');
            let b = xfrmOf(spPr);
            const ph = q(el, 'ph')[0];
            if (!b && ph) b = lph['i:' + ph.getAttribute('idx')] || lph['t:' + (ph.getAttribute('type') || 'body')] || mph['t:' + (ph.getAttribute('type') || 'body')];
            b = apply(b); if (!b) return;
            const geom = q(spPr, 'prstGeom')[0]; const prst = geom ? geom.getAttribute('prst') : 'rect';
            const kind = PRST[prst] || 'rect';
            let fill = fillOf(spPr); const ln = kid(spPr, 'ln');
            const stroke = ln && !kid(ln, 'noFill') ? colorOf(kid(ln, 'solidFill')) : '';
            const sw = ln && stroke ? Math.max(1, Math.round((+ln.getAttribute('w') || 12700) / E)) : 0;
            const style = kid(el, 'style');
            if (fill === undefined && style) { const fr = kid(style, 'fillRef'); fill = fr && +fr.getAttribute('idx') > 0 ? colorOf(fr) : ''; }
            const isTitle = ph && /title/i.test(ph.getAttribute('type') || '');
            const txt2 = textOf(kid(el, 'txBody'), { pt: isTitle ? 40 : 18, align: isTitle ? 'left' : 'left' });
            const anchor = q(el, 'bodyPr')[0]; const va = anchor ? ({ ctr: 'middle', b: 'bottom' })[anchor.getAttribute('anchor')] || 'top' : 'top';
            const textColor = theme.dk1 || '#000000';
            if (kind === 'line' || n === 'cxnSp') { page.layers.push(Design.shapeLayer('line', { x: Math.round(b.x), y: Math.round(b.y + b.h / 2 - 8), w: Math.round(Math.max(b.w, 2)), h: 16, rot: b.rot, stroke: stroke || '#222222', sw: sw || 2, arrowEnd: !!(ln && kid(ln, 'tailEnd') && kid(ln, 'tailEnd').getAttribute('type') && kid(ln, 'tailEnd').getAttribute('type') !== 'none') })); return; }
            if (!fill && !stroke && kind === 'rect') {
              if (!txt2.html.replace(/<[^>]+>/g, '').trim()) return;
              page.layers.push(Design.textLayer(txt2.html, { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h), rot: b.rot, size: txt2.size, color: textColor, font: 'Noto Sans KR', lh: 1.2 }));
            } else {

            const b = apply({ x: +off.getAttribute('x') / E, y: +off.getAttribute('y') / E, w: +ext.getAttribute('cx') / E, h: +ext.getAttribute('cy') / E });
