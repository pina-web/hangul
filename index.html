<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HWP 편집실</title>
<meta name="description" content="한글(HWP·HWPX) 문서를 브라우저에서 열고 편집하고, 디자인·슬라이드쇼로 바꿔 HWPX·HWP·PPTX·DOCX·PDF 등으로 저장하는 편집기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gowun+Dodum&family=Gowun+Batang&family=Nanum+Pen+Script&family=Gaegu&family=Song+Myung&display=swap">
<style>
/* 레이아웃: 상단 파일 막대(모드 전환) + 문서 모드(리본·상황 막대·쪽) / 디자인 모드(도구·쪽 목록·작업면·속성) */
:root {
  --bg: #ffffff;          /* 작업면 (항상 흰색) */
  --ink: #1b2333;         /* 본문 글자 */
  --ink-2: #5b6578;       /* 보조 글자 */
  --line: #e3e7ee;        /* 구분선 */
  --line-2: #cfd6e2;
  --tint: #f4f6fa;        /* 버튼 눌림·호버 */
  --accent: #1f4fbf;      /* 한컴 파랑 계열 */
  --accent-ink: #ffffff;
  --accent-soft: #e8eefb;
  --warn: #b45309;
  --danger: #b42318;
  --ok: #157f3b;
  --sel: #2563eb;         /* 개체 선택 테두리 */
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --doc: "함초롬바탕", "HCR Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); margin: 0; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: calc(100% - var(--anav-h, 63px)); } /* 상단 공통 메뉴바(arte-bar) 아래에 편집기 배치 */

/* 상단 파일 막대 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.docname { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.docname input { min-width: 0; flex: 1; max-width: 380px; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-size: 14px; font-weight: 500; background: transparent; }
.docname input:hover { border-color: var(--line); }
.docname input:focus { outline: none; border-color: var(--accent); background: #fff; }
.fmt-chip { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: none; }
.app.dirty .dirty-dot { display: inline-block; }
.modes { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--tint); }
.modes button { border: 0; background: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.modes button svg { width: 15px; height: 15px; }
.modes button.on { background: #fff; color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(27,35,51,.12); }
.file-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: #fff; border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { background: #1a43a6; }
.btn.danger { color: var(--danger); }
.btn svg { width: 15px; height: 15px; flex: none; }

/* 서식 리본 */
.ribbon { display: flex; align-items: center; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); flex: none; }
.grp:last-child { border-right: 0; }
.tb { width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; display: grid; place-items: center; position: relative; flex: none; padding: 0; }
.tb:hover { background: var(--tint); }
.tb.on { background: var(--accent-soft); border-color: #c5d3f3; color: var(--accent); }
.tb svg { width: 17px; height: 17px; }
.tb .sw { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 1px; }
.tb.wide { width: auto; padding: 0 8px; gap: 5px; display: inline-flex; }
.tb.sm { width: 24px; height: 24px; }
.tb.sm svg { width: 14px; height: 14px; }
.tb-txt { font-size: 12px; white-space: nowrap; }
.sel { height: 30px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; padding: 0 6px; cursor: pointer; }
.sel:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
#fontSel { width: 128px; } #sizeSel { width: 62px; } #styleSel { width: 84px; } #lhSel { width: 72px; }

/* 상황 막대(표·그림·개체) */
.ctxbar { display: flex; align-items: center; gap: 4px; padding: 5px 16px; border-bottom: 1px solid var(--line); background: #fafbfd; overflow-x: auto; flex-wrap: nowrap; }
.ctxbar .label { font-size: 12px; font-weight: 600; color: var(--accent); margin-right: 6px; white-space: nowrap; }
.ctxbar .btn { padding: 4px 9px; font-size: 12px; }
.ctxbar .sel { height: 28px; font-size: 12px; }
.ctxbar input[type=number] { width: 70px; height: 28px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; }
.ctxbar .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; flex: none; }
.ctxbar label.inl { display: flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; font-size: 12px; }

/* 작업면 */
.workspace { flex: 1; overflow: auto; position: relative; background: var(--bg); }
.workspace.drop { outline: 3px dashed var(--accent); outline-offset: -10px; }
#zoomWrap { padding: 28px 16px 60px; width: max-content; min-width: 100%; box-sizing: border-box; }
.sheet { position: relative; margin: 0 auto; width: max-content; }
.page { position: relative; isolation: isolate; overflow: hidden; box-sizing: border-box; background: #fff; border: 1px solid var(--line-2); box-shadow: 0 1px 2px rgba(27,35,51,.06), 0 8px 28px rgba(27,35,51,.07);
  font-family: var(--doc); font-size: 10pt; line-height: 1.6; color: #000; text-align: justify; word-break: keep-all; overflow-wrap: anywhere; outline: none; tab-size: 4; caret-color: #000; counter-reset: fn; }
.page p, .page h1, .page h2, .page h3, .page li, .page div { margin: 0; }
.page p, .page h1, .page h2, .page h3, .page h4, .page li, .page blockquote, .page div:not(.fobj) { position: relative; }
.page h1 { font-size: 18pt; font-weight: bold; margin: 6pt 0; line-height: 1.4; }
.page h2 { font-size: 15pt; font-weight: bold; margin: 5pt 0; line-height: 1.4; }
.page h3 { font-size: 12pt; font-weight: bold; margin: 4pt 0; line-height: 1.4; }
.page blockquote { margin: 0 0 0 10mm; padding-left: 3mm; border-left: 2px solid #bbb; }
.page ul, .page ol { margin: 0; padding-left: 7mm; }
.page table { border-collapse: collapse; margin: 1px 0; table-layout: fixed; max-width: 100%; }
.page td, .page th { border: 1px solid #000; padding: .5mm 1.8mm; vertical-align: middle; min-width: 8px; word-break: keep-all; overflow-wrap: anywhere; position: relative; }
.page table.noborder td { border: 1px dotted #c6cdd9; }
.page td.cell-sel { box-shadow: inset 0 0 0 2px rgba(31,79,191,.45); }
.page img { max-width: 100%; vertical-align: bottom; }
.page img[data-wrap="square"] { margin: 1mm 3mm 2mm 0; }
.page img[data-wrap="square"][style*="right"] { margin: 1mm 0 2mm 3mm; }
.page img[data-wrap="block"] { display: block; margin: 2mm 0; }
.page img[data-wrap="block"][data-align="center"] { margin-left: auto; margin-right: auto; }
.page img[data-wrap="block"][data-align="right"] { margin-left: auto; }
.page a[href] { color: #1f4fbf; text-decoration: underline; cursor: text; }
.page .tab { white-space: pre; }
.page .textbox { border: 1px dashed #c6cdd9; padding: 1mm 2mm; margin: 1mm 0; }
.page .eq { font-family: var(--mono); font-size: .92em; background: #f1f3f7; padding: 0 3px; border-radius: 3px; }
.page .ph { color: #8a93a3; font-size: .9em; }
.page .fn { counter-increment: fn; cursor: pointer; }
.page .fn::after { content: counter(fn) ")"; vertical-align: super; font-size: .72em; color: #1f4fbf; font-family: var(--ui); padding: 0 1px; }
/* 떠 있는 개체: 글 앞/뒤(종이 위 자유 배치), 어울림/자리 차지(글과 함께 흐름) */
.page .fobj { position: absolute; z-index: 3; display: block; box-sizing: border-box; line-height: normal; text-indent: 0; text-align: left; }
.page .fobj[data-wrap="behind"] { z-index: -1; }
.page .fobj[data-wrap="square"] { position: relative; float: left; margin: 1mm 3mm 2mm 0; left: auto !important; top: auto !important; }
.page .fobj[data-wrap="square"][data-align="right"] { float: right; margin: 1mm 0 2mm 3mm; }
.page .fobj[data-wrap="block"] { position: relative; margin: 2mm 0; left: auto !important; top: auto !important; }
.page .fobj[data-wrap="block"][data-align="center"] { margin-left: auto; margin-right: auto; }
.page .fobj[data-wrap="block"][data-align="right"] { margin-left: auto; }
.page .fobj > img { width: 100%; height: 100%; display: block; max-width: none; }
.page .fobj > svg { display: block; overflow: visible; }
.page .fobj .tbox { width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; outline: none; cursor: text; }
.page .fobj .tbox:not([style*="border"]) { box-shadow: inset 0 0 0 1px rgba(143,160,190,.45); }
.page .pagebreak { height: 0; border-top: 1px dashed #8fa6dc; margin: 8px 0; position: relative; user-select: none; box-sizing: content-box; }
.page .pagebreak::after { content: "쪽 나누기"; position: absolute; right: 0; top: -9px; font: 10px var(--ui); color: var(--accent); background: #fff; padding: 0 4px; }
.page ::selection { background: #c9d7f7; }
.page.painting { cursor: copy; }
.markers { position: absolute; inset: 0; pointer-events: none; }
.marker { position: absolute; left: -1px; right: -1px; height: 0; border-top: 1px dashed #c8d0de; }
.marker span { position: absolute; right: -54px; top: -8px; font: 11px var(--ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hfz { position: absolute; font-family: var(--doc); font-size: 9pt; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fn-list { margin: 10px auto 0; font: 12px/1.6 var(--doc); color: #333; border-top: 1px solid #999; padding-top: 6px; }
.fn-list .fn-h { font: 600 11px var(--ui); color: var(--ink-2); margin-bottom: 2px; }
.fn-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 2px; cursor: pointer; font: inherit; color: inherit; border-radius: 4px; }
.fn-list button:hover { background: var(--tint); }
/* 개체 선택 상자 */
#objBox { position: absolute; border: 1.5px solid var(--sel); pointer-events: none; z-index: 20; box-sizing: border-box; }
#objBox .oh { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--sel); border-radius: 2px; pointer-events: auto; box-sizing: border-box; }
#objBox .oh[data-h="nw"] { left: -6px; top: -6px; cursor: nwse-resize; } #objBox .oh[data-h="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
#objBox .oh[data-h="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; } #objBox .oh[data-h="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
#objBox .oh[data-h="n"] { left: calc(50% - 5px); top: -6px; cursor: ns-resize; } #objBox .oh[data-h="s"] { left: calc(50% - 5px); bottom: -6px; cursor: ns-resize; }
#objBox .oh[data-h="e"] { right: -6px; top: calc(50% - 5px); cursor: ew-resize; } #objBox .oh[data-h="w"] { left: -6px; top: calc(50% - 5px); cursor: ew-resize; }
#objBox .omove { position: absolute; left: -1px; top: -24px; height: 20px; padding: 0 7px; display: flex; align-items: center; gap: 4px; background: var(--sel); color: #fff; font: 11px var(--ui); border-radius: 4px 4px 0 0; pointer-events: auto; cursor: move; white-space: nowrap; }
#objBox .osize { position: absolute; right: -1px; bottom: -22px; font: 11px var(--ui); color: #fff; background: rgba(27,35,51,.75); border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.colgrip { position: absolute; width: 7px; cursor: col-resize; z-index: 15; }
.colgrip:hover, .colgrip.on { background: rgba(37,99,235,.35); }

/* 상태줄 */
.status { display: flex; align-items: center; gap: 16px; padding: 5px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); flex-wrap: wrap; padding-bottom: calc(5px + env(safe-area-inset-bottom, 0px)); }
.status .sp { flex: 1; }
.status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.status .chip { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 1px 9px; cursor: pointer; font-size: 12px; }
.status .chip:hover { background: var(--tint); }
.zoom { display: flex; align-items: center; gap: 4px; }
.zoom select, .dstatus select { height: 24px; border: 1px solid var(--line-2); border-radius: 5px; background: #fff; }

/* 펼침 메뉴·팝오버 */
.pop { position: fixed; z-index: 70; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 34px rgba(27,35,51,.16); padding: 6px; min-width: 200px; max-height: calc(100vh - 24px); overflow: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--tint); outline: none; }
.menu-item .ext { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); padding-left: 12px; }
.menu-item small { display: block; color: var(--ink-2); font-size: 11px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-head { font-size: 11px; color: var(--ink-2); padding: 6px 10px 4px; letter-spacing: .04em; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; padding: 4px; }
.swatches button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
.swatches button:hover { transform: scale(1.12); }
.pop-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px 2px; font-size: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; padding: 6px; }
.tgrid i { width: 18px; height: 18px; border: 1px solid var(--line-2); border-radius: 3px; display: block; cursor: pointer; }
.tgrid i.on { background: var(--accent-soft); border-color: var(--accent); }
.tgrid-label { text-align: center; font-size: 12px; color: var(--ink-2); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.chars { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; padding: 4px; }
.chars button { height: 30px; border: 1px solid transparent; background: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
.chars button:hover { background: var(--tint); border-color: var(--line); }

/* 찾기 패널 */
.findbar { position: absolute; top: 10px; right: 18px; z-index: 30; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 8px 26px rgba(27,35,51,.14); padding: 10px; display: grid; gap: 6px; width: min(340px, calc(100vw - 40px)); }
.findbar .row { display: flex; gap: 6px; align-items: center; }
.findbar input[type=text] { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; }
.findbar .btn { padding: 4px 9px; font-size: 12px; }
.findbar .count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 대화상자 */
.modal-back { position: fixed; inset: 0; background: rgba(27,35,51,.28); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(27,35,51,.25); width: min(480px, 100%); padding: 20px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-2); line-height: 1.6; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal .choice { display: grid; gap: 8px; }
.modal .choice button { text-align: left; border: 1px solid var(--line-2); background: #fff; border-radius: 9px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.modal .choice button:hover, .modal .choice button:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.modal .choice b { font-weight: 600; }
.modal .choice span { color: var(--ink-2); font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field input, .field select, .field textarea { height: 32px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
.field textarea { height: auto; min-height: 70px; padding: 6px 8px; resize: vertical; font: inherit; }
.field input[type=color] { padding: 2px; width: 100%; }
.field.full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
.checks label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 6px; cursor: pointer; font-size: 13px; color: var(--ink); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--accent); font-weight: 600; }
.seg label:has(input:checked) { background: var(--accent-soft); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.preview-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--doc); min-height: 28px; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 2147483600; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 26px rgba(0,0,0,.2); max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast.err { background: var(--danger); }
.toast button { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.busy { position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.72); display: grid; place-items: center; }
.busy-box { background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 18px 22px; box-shadow: 0 12px 40px rgba(27,35,51,.15); display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { display: flex; gap: 10px; align-items: center; padding: 8px 16px; background: #fff7e8; border-bottom: 1px solid #f3dfb5; font-size: 13px; flex-wrap: wrap; }
.banner .sp { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.page:focus-visible, .tbox:focus-visible, .ly-t:focus-visible, .dstage:focus-visible { outline: none; }

/* ===== 디자인 모드 ===== */
.design { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.dbar .btn { padding: 5px 10px; }
.dbar .sp { flex: 1; }

<p style="text-align:center;line-height:1.4"><span style="font-family:'함초롬돋움','Noto Sans KR',sans-serif;font-size:20pt;font-weight:bold">HWP 편집실 사용 안내</span></p>

/* ---- model.js ---- */
/* ===== 편집기 DOM → 문서 모델(블록·런) =====
 * 모든 저장기(HWPX/DOCX/MD/TXT)가 같은 모델을 사용한다.
 * 블록: {t:'p', align, lh(%), ml, mr, ti, mt, mb(px), pb, tag, list, runs:[...]}
 *       {t:'table', rows:[[cell]], colW:[px], border}
 * 런:   {text, b,i,u,s,sup,sub,color,bg,size(pt),font} | {br} | {tab} | {img:{src,w,h}}
 */
const Fonts = (() => {
  const SERIF = /바탕|명조|궁서|batang|myeongjo|serif|times|georgia|garamond|신명|휴먼명조|한컴바탕/i;
  function css(name) {
    if (!name) return '';
    const n = name.replace(/["']/g, '');
    // 작은따옴표: HTML style="…" 속성 안에 그대로 넣어도 깨지지 않게
    const fb = SERIF.test(n) ? "'Noto Serif KR', 'Nanum Myeongjo', serif" : "'Noto Sans KR', 'Nanum Gothic', sans-serif";
    return `'${n}', ${fb}`;
  }
  function first(family) {
    if (!family) return '';
    const f = family.split(',')[0].trim().replace(/^["']|["']$/g, '');
    if (/^(serif|sans-serif|monospace|system-ui|-apple-system|inherit)$/i.test(f)) return '';
    return f;
  }
  return { css, first };
})();

const DocModel = (() => {
  const BLOCK_TAGS = new Set(['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI', 'BLOCKQUOTE', 'PRE', 'UL', 'OL', 'SECTION', 'ARTICLE', 'HEADER', 'FOOTER', 'CENTER', 'ADDRESS', 'FIGURE', 'FIGCAPTION', 'DL', 'DT', 'DD']);

  function rgbToHex(c) {
    if (!c) return null;
    const m = c.match(/rgba?\(([^)]+)\)/);
    if (!m) return /^#/.test(c) ? c : null;
    const p = m[1].split(',').map((x) => parseFloat(x));
    if (p.length === 4 && p[3] === 0) return null;
    return '#' + p.slice(0, 3).map((x) => Math.round(x).toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  function runStyle(el, blockEl) {
    const cs = getComputedStyle(el);
    const r = {};
    const fw = parseInt(cs.fontWeight, 10) || (cs.fontWeight === 'bold' ? 700 : 400);
    if (fw >= 600) r.b = 1;
    if (cs.fontStyle === 'italic' || cs.fontStyle === 'oblique') r.i = 1;
    // 밑줄·취소선·위첨자는 상속되지 않으므로 조상까지 확인
    let n = el; let size = parseFloat(cs.fontSize);
    while (n && n !== blockEl && n.nodeType === 1) {
      const s = getComputedStyle(n);
      const d = s.textDecorationLine || s.textDecoration || '';
      if (d.includes('underline')) r.u = 1;
      if (d.includes('line-through')) r.s = 1;
      if (s.verticalAlign === 'super') r.sup = 1;
      if (s.verticalAlign === 'sub') r.sub = 1;
      if (!r.bg) { const bg = rgbToHex(s.backgroundColor); if (bg && bg !== '#FFFFFF') r.bg = bg; }
      n = n.parentElement;
    }
    if ((r.sup || r.sub) && el.parentElement) size = Math.max(size, parseFloat(getComputedStyle(el.parentElement).fontSize) || size);
    if ((r.sup || r.sub) && (el.tagName === 'SUP' || el.tagName === 'SUB')) size = parseFloat(getComputedStyle(el.parentElement).fontSize) || size;
    r.size = Math.round(size * 0.75 * 2) / 2;
    const col = rgbToHex(cs.color); if (col && col !== '#000000') r.color = col;
    const f = Fonts.first(cs.fontFamily); if (f) r.font = f;
    // 자간: CSS letter-spacing(px) → 한글 자간(글자 크기의 %)
    const lsp = parseFloat(cs.letterSpacing);
    if (lsp && size) r.ls = Math.round(lsp / size * 100);
    if (cs.textShadow && cs.textShadow !== 'none') r.shadow = 1;
    if (parseFloat(cs.webkitTextStrokeWidth || cs.getPropertyValue('-webkit-text-stroke-width')) > 0) r.outline = 1;
    const a = el.closest && el.closest('a[href]');
    if (a && (!blockEl || blockEl.contains(a) || a.contains(blockEl))) r.link = a.getAttribute('href');
    return r;
  }

  function paraProps(el, root) {
    const cs = getComputedStyle(el);
    const fs = parseFloat(cs.fontSize) || 13.333;
    let lh = 160;
    if (cs.lineHeight && cs.lineHeight !== 'normal') lh = Math.round(parseFloat(cs.lineHeight) / fs * 100);
    let align = cs.textAlign;
    align = ({ start: 'left', end: 'right', '-webkit-left': 'left', '-webkit-center': 'center', '-webkit-right': 'right' })[align] || align;
    if (!['left', 'right', 'center', 'justify'].includes(align)) align = 'left';
    let ml = 0, mr = 0;
    if (root && el !== root) {
      const rr = root.getBoundingClientRect(), er = el.getBoundingClientRect();
      const rcs = getComputedStyle(root);
      ml = Math.max(0, er.left - rr.left - parseFloat(rcs.paddingLeft) - parseFloat(rcs.borderLeftWidth) + parseFloat(cs.paddingLeft));
      mr = Math.max(0, rr.right - er.right - parseFloat(rcs.paddingRight) - parseFloat(rcs.borderRightWidth) + parseFloat(cs.paddingRight));
      const z = zoomOf(root); ml /= z; mr /= z;
    }
    return {
      align, lh: Math.min(Math.max(lh, 50), 500),
      ml: Math.round(ml), mr: Math.round(mr), ti: Math.round(parseFloat(cs.textIndent) || 0),
      mt: Math.round(parseFloat(cs.marginTop) || 0), mb: Math.round(parseFloat(cs.marginBottom) || 0),
      tag: el.tagName,
    };
  }
  // 화면 배율(CSS zoom 등)을 실제 크기 비율로 잰다
  function zoomOf(el) {
    const w = el.offsetWidth; if (!w) return 1;
    const z = el.getBoundingClientRect().width / w;
    return z && isFinite(z) ? z : 1;
  }

  function extract(root, opts = {}) {
    const blocks = [];
    const z0 = zoomOf(root); const rr0 = root.getBoundingClientRect();
    const local = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - rr0.left) / z0, y: (r.top - rr0.top) / z0, w: r.width / z0, h: r.height / z0 }; };
    const paperPos = opts.paperPos || ((el) => local(el));
    let cur = null; let pendingPB = false;
    const listCounters = [];
    function newP(blockEl, prefix) {
      cur = Object.assign({ t: 'p', runs: [] }, paraProps(blockEl, root));
      if (pendingPB) { cur.pb = true; pendingPB = false; }
      if (prefix) cur.runs.push(Object.assign({ text: prefix }, runStyle(blockEl, blockEl)));
    }
    function flush() {
      if (!cur) return;
      // 브라우저가 넣는 끝 <br> 자리표시 제거
      while (cur.runs.length && cur.runs[cur.runs.length - 1].br) {
        cur.runs.pop();
        break;
      }
      blocks.push(cur); cur = null;
    }
    function walk(node, blockEl) {
      for (const ch of Array.from(node.childNodes)) {
        if (ch.nodeType === 3) {
          let t = ch.nodeValue;
          const ws = getComputedStyle(ch.parentElement).whiteSpace;
          if (!/pre/.test(ws)) t = t.replace(/[ \t\n\r]+/g, ' ');
          if (!t) continue;
          if (!cur && !t.trim() ) continue;
          if (!cur) newP(blockEl);
          const st = runStyle(ch.parentElement, blockEl);
          // 탭 분리
          const parts = t.split('\t');
          parts.forEach((part, i) => {
            if (i > 0) cur.runs.push({ tab: 1 });
            if (part) cur.runs.push(Object.assign({ text: part.replace(/ /g, ' ') }, st));
          });
        } else if (ch.nodeType === 1) {
          const tag = ch.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || ch.classList.contains('page-marker')) continue;
          const disp = getComputedStyle(ch).display;
          if (disp === 'none') continue;
          if (tag === 'BR') { if (!cur) newP(blockEl); cur.runs.push({ br: 1 }); }
          else if (ch.classList.contains('fobj')) {
            // 글 앞/뒤에 떠 있는 개체: 종이 기준 좌표로 기록
            if (!cur) newP(blockEl);
            const ob = floatObj(ch); if (ob) cur.runs.push({ obj: ob });
          } else if (ch.classList.contains('fn')) {
            if (!cur) newP(blockEl);
            cur.runs.push({ fn: ch.getAttribute('data-note') || '' });
          } else if (tag === 'IMG') {
            if (!cur) newP(blockEl);
            const w = Math.max(1, Math.round(ch.width || ch.naturalWidth)), h = Math.max(1, Math.round(ch.height || ch.naturalHeight));
            const wrap = ch.getAttribute('data-wrap');
            if (wrap === 'square' || wrap === 'block') {
              const fl = getComputedStyle(ch).float;
              const align = wrap === 'square' ? (fl === 'right' ? 'right' : 'left') : (ch.getAttribute('data-align') || 'center');
              cur.runs.push({ obj: { kind: 'pic', src: ch.currentSrc || ch.src, w, h, wrap, align } });
            } else cur.runs.push({ img: { src: ch.currentSrc || ch.src, w, h } });
          } else if (tag === 'TABLE') { flush(); const tb = table(ch); if (pendingPB) { tb.pb = true; pendingPB = false; } blocks.push(tb); }
          else if (ch.classList.contains('pagebreak')) { flush(); pendingPB = true; }
          else if (tag === 'HR') { flush(); newP(blockEl); cur.runs.push({ text: '─'.repeat(40) }); flush(); }
          else if (tag === 'UL' || tag === 'OL') {
            flush(); listCounters.push({ ol: tag === 'OL', n: parseInt(ch.getAttribute('start') || '1', 10) });
            walk(ch, ch); flush(); listCounters.pop();
          } else if (tag === 'LI') {
            flush();
            const lc = listCounters[listCounters.length - 1];
            const depth = Math.max(0, listCounters.length - 1);
            const prefix = lc ? (lc.ol ? (lc.n++) + '. ' : ['• ', '◦ ', '▪ '][depth % 3]) : '• ';
            newP(ch, prefix); cur.list = 1; walk(ch, ch); flush();
          } else if (BLOCK_TAGS.has(tag) || /^(block|flex|grid|list-item|table-caption)$/.test(disp)) {
            flush(); walk(ch, ch); flush();
          } else walk(ch, blockEl);
        }
      }
    }
    function floatObj(fo) {
      const wrap = fo.getAttribute('data-wrap') === 'behind' ? 'behind' : 'front';
      const p = paperPos(fo); const b = local(fo);
      const base = { wrap, x: Math.round(p.x), y: Math.round(p.y), w: Math.max(1, Math.round(fo.offsetWidth || b.w)), h: Math.max(1, Math.round(fo.offsetHeight || b.h)) };
      const img = fo.querySelector(':scope > img');
      if (img) return Object.assign(base, { kind: 'pic', src: img.currentSrc || img.src });
      const kind = fo.getAttribute('data-kind');
      const st = getComputedStyle(fo);
      if (kind === 'line') {
        const ln = fo.querySelector('line');
        return Object.assign(base, { kind: 'line', stroke: (ln && ln.getAttribute('stroke')) || '#000000', sw: parseFloat((ln && ln.getAttribute('stroke-width')) || 2), arrow: fo.getAttribute('data-arrow') === '1', dash: !!(ln && ln.getAttribute('stroke-dasharray')) });
      }
      const tb = fo.querySelector(':scope > .tbox') || fo;
      const ts = getComputedStyle(tb);
      const bg = rgbToHex(ts.backgroundColor);
      const bw = parseFloat(ts.borderTopWidth) || 0;
      return Object.assign(base, {
        kind: 'box', shape: kind === 'ellipse' ? 'ellipse' : 'rect', fill: bg || '', stroke: bw && ts.borderTopStyle !== 'none' ? rgbToHex(ts.borderTopColor) || '#000000' : '', sw: bw, dash: ts.borderTopStyle === 'dashed',
        radius: parseFloat(ts.borderTopLeftRadius) || 0, pad: parseFloat(ts.paddingLeft) || 0,
        va: ({ center: 'CENTER', 'flex-end': 'BOTTOM' })[ts.justifyContent] || 'TOP',
        blocks: extract(tb),
      });
      void st;
    }
    function table(tb) {
      const rows = [];
      const grid = [];
      Array.from(tb.rows).forEach((tr, ri) => {
        const row = [];
        grid[ri] = grid[ri] || [];
        let c = 0;
        Array.from(tr.cells).forEach((td) => {
          while (grid[ri][c]) c++;
          const cs = Math.max(1, td.colSpan || 1), rs = Math.max(1, Math.min(td.rowSpan || 1, tb.rows.length - ri));
          for (let y = 0; y < rs; y++) for (let x = 0; x < cs; x++) { grid[ri + y] = grid[ri + y] || []; grid[ri + y][c + x] = true; }
          const st = getComputedStyle(td);
          const bg = rgbToHex(st.backgroundColor);
          const inner = extract(td);
          row.push({ r: ri, c, cs, rs, w: td.getBoundingClientRect().width / zoomOf(td), h: td.getBoundingClientRect().height / zoomOf(td),
            bg: bg && bg !== '#FFFFFF' ? bg : null, border: st.borderTopStyle !== 'none' && st.borderTopStyle !== 'dotted' && st.borderTopStyle !== 'hidden',
            va: ({ top: 'TOP', bottom: 'BOTTOM' })[st.verticalAlign] || 'CENTER',
            blocks: inner.length ? inner : [{ t: 'p', align: 'left', lh: 160, ml: 0, mr: 0, ti: 0, mt: 0, mb: 0, runs: [] }] });
          c += cs;
        });
        rows.push(row);
      });
      const cols = Math.max(1, ...grid.map((r) => r ? r.length : 0));
      // 빈 칸(행마다 칸 수가 다른 표)은 빈 셀로 채워 격자를 완성
      for (let ri = 0; ri < grid.length; ri++) {
        grid[ri] = grid[ri] || [];
        if (!rows[ri]) rows[ri] = [];
        for (let c = 0; c < cols; c++) {
          if (grid[ri][c]) continue;
          grid[ri][c] = true;
          rows[ri].push({ r: ri, c, cs: 1, rs: 1, w: 0, h: 0, bg: null, border: rows[ri][0] ? rows[ri][0].border : true, va: 'CENTER',
            blocks: [{ t: 'p', align: 'left', lh: 160, ml: 0, mr: 0, ti: 0, mt: 0, mb: 0, runs: [] }] });
        }
        rows[ri].sort((a, b) => a.c - b.c);
      }
      const colW = new Array(cols).fill(0);
      rows.flat().forEach((cell) => { if (cell.cs === 1) colW[cell.c] = Math.max(colW[cell.c], cell.w); });
      // 단일 칸 너비가 없는 열은 병합 셀에서 나눠서 추정
      rows.flat().forEach((cell) => {
        if (cell.cs > 1) {
          const known = colW.slice(cell.c, cell.c + cell.cs).reduce((a, b) => a + b, 0);
          const empty = colW.slice(cell.c, cell.c + cell.cs).filter((x) => !x).length;
          if (empty) for (let k = cell.c; k < cell.c + cell.cs; k++) if (!colW[k]) colW[k] = Math.max(20, (cell.w - known) / empty);
        }
      });
      for (let k = 0; k < cols; k++) if (!colW[k]) colW[k] = 60;
      const rowH = grid.map((r, ri) => {
        const tr = tb.rows[ri]; return tr ? tr.getBoundingClientRect().height / zoomOf(tb) : 24;
      });
      const anyBorder = rows.flat().some((c) => c.border);
      return { t: 'table', rows, cols, nrows: grid.length, colW, rowH, border: anyBorder, align: tb.style.marginLeft === 'auto' && tb.style.marginRight === 'auto' ? 'center' : 'left' };
    }
    walk(root, root); flush();
    return blocks;
  }

  function plainText(blocks) {
    const out = [];
    for (const b of blocks) {
      if (b.t === 'p') {
        out.push(b.runs.map((r) => r.text || (r.br ? '\n' : r.tab ? '\t' : r.img ? '[그림]' : r.fn !== undefined ? '' : '')).join(''));
        b.runs.forEach((r) => { if (r.obj && r.obj.blocks) out.push(plainText(r.obj.blocks)); });
      }
      else if (b.t === 'table') for (const row of b.rows) out.push(row.map((c) => plainText(c.blocks).replace(/\n/g, ' ')).join('\t'));
    }
    return out.join('\n');
  }

  return { extract, plainText, rgbToHex };
})();

/* ===== 쪽 나누기 어림 계산 =====
 * 편집 화면은 이어진 한 장이라 실제 쪽 경계를 계산해서 쓴다.
 * 쪽 번호 표시, 디자인 변환, 떠 있는 개체의 종이 좌표에 공통으로 쓴다.
 */
const Pager = (() => {
  const MMPX = 96 / 25.4;
  function layout(ed, page) {
    const er = ed.getBoundingClientRect();
    const z = ed.offsetWidth ? er.width / ed.offsetWidth : 1;
    const top = (page.mt + page.hd) * MMPX, bottom = (page.mb + page.ft) * MMPX;
    const contentH = Math.max(50, page.h * MMPX - top - bottom);
    const starts = [top]; let pageStart = top; let forced = false;
    for (const k of Array.from(ed.children)) {
      if (k.classList.contains('pagebreak')) { forced = true; continue; }
      const r = k.getBoundingClientRect();
      if (!r.height && !r.width) continue;
      const mt = parseFloat(getComputedStyle(k).marginTop) || 0;
      const t = (r.top - er.top) / z - mt, b = (r.bottom - er.top) / z;
      if (forced) { pageStart = Math.max(t, pageStart); starts.push(pageStart); forced = false; }
      if (b - pageStart > contentH + 1 && t > pageStart + 1 && (b - t) < contentH * 0.3) { pageStart = t; starts.push(pageStart); }
      while (b - pageStart > contentH + 1) { pageStart += contentH; starts.push(pageStart); }
    }
    return {
      starts, top, contentH, z, er,
      pageOf(y) { let k = 0; for (let i = 0; i < starts.length; i++) if (y >= starts[i] - 0.5) k = i; return k; },
      // 편집 화면 좌표 ↔ 종이 좌표
      toPaper(x, y, anchorY) { const k = this.pageOf(anchorY === undefined ? y : anchorY); return { x, y: y - starts[k] + top, k }; },
      fromPaper(x, y, k) { return { x, y: (starts[k] || starts[starts.length - 1]) + y - top }; },
    };
  }
  // 강제 쪽 나누기 뒤의 내용이 다음 쪽 첫머리에서 시작하도록 쪽 나누기 높이를 늘린다
  function fillBreaks(ed, page) {
    const brks = Array.from(ed.children).filter((k) => k.classList.contains('pagebreak'));
    brks.forEach((b) => { b.style.height = '0px'; });
    if (!brks.length) return;
    const top = (page.mt + page.hd) * MMPX, bottom = (page.mb + page.ft) * MMPX;
    const contentH = Math.max(50, page.h * MMPX - top - bottom);

/* ===== 라이브러리 지연 로더 + HWP 변환 엔진(Pyodide + python-hwpx, Apache-2.0) ===== */
const Loader = (() => {
  const LIBS = {
    html2canvas: ['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', 'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'],
    jspdf: ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'],
    mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js'],
    pptxgenjs: ['https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js', 'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'],
  };
  const GLOBAL = { html2canvas: 'html2canvas', jspdf: 'jspdf', mammoth: 'mammoth', pptxgenjs: 'PptxGenJS' };
  const done = {};
  function script(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = url; s.async = true;
      s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('불러오기 실패: ' + url)); };
      document.head.appendChild(s);
    });
  }
  async function need(name) {
    if (window[GLOBAL[name]]) return;
    if (done[name]) return done[name];
    done[name] = (async () => {
      let err;
      for (const u of LIBS[name]) { try { await script(u); if (window[GLOBAL[name]]) return; } catch (e) { err = e; } }
      done[name] = null;
      throw new Error('인터넷 연결을 확인해 주세요. 필요한 구성요소(' + name + ')를 불러오지 못했습니다.');
    })();
    return done[name];
  }
  return { need, script };
})();

const Engine = (() => {
  const BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
  const GLUE = `
import zipfile
from hwpx.hwp5.writer import write_hwp5
from hwpx.hwp5.package import convert, to_hwpx_bytes

def to_hwp(src, dst):
    z = zipfile.ZipFile(src)
    files = {n: z.read(n) for n in z.namelist()}
    data = write_hwp5(files)
    with open(dst, 'wb') as f:
        f.write(data)

def to_hwpx(src, dst):
    with open(src, 'rb') as f:
        c = convert(f.read())
    with open(dst, 'wb') as f:
        f.write(to_hwpx_bytes(c.files))
`;
  let py = null, loading = null;
  function ready() { return !!py; }
  async function load(status = () => {}) {
    if (py) return py;
    if (loading) return loading;
    loading = (async () => {
      status('HWP 엔진 내려받는 중… (처음 한 번만, 약 15MB)');
      if (!window.loadPyodide) await Loader.script(BASE + 'pyodide.js');
      const p = await window.loadPyodide({ indexURL: BASE });
      status('문서 처리 모듈 준비 중…');
      await p.loadPackage(['micropip', 'lxml']);
      status('HWP 변환기 설치 중…');
      const mp = p.pyimport('micropip');
      await mp.install('python-hwpx==6.8.0');
      await p.runPythonAsync(GLUE);
      py = p; return p;
    })();
    try { return await loading; } catch (e) { loading = null; throw e; }
  }
  async function hwpxToHwp(u8, status) {
    const p = await load(status);
    status && status('HWP 파일로 변환 중…');
    p.FS.writeFile('/tmp/in.hwpx', u8);
    p.runPython('to_hwp("/tmp/in.hwpx", "/tmp/out.hwp")');
    return p.FS.readFile('/tmp/out.hwp');
  }
  async function hwpToHwpx(u8, status) {
    const p = await load(status);
    status && status('HWP 문서 정밀 변환 중…');
    p.FS.writeFile('/tmp/in.hwp', u8);
    p.runPython('to_hwpx("/tmp/in.hwp", "/tmp/out.hwpx")');
    return p.FS.readFile('/tmp/out.hwpx');
  }
  return { load, ready, hwpxToHwp, hwpToHwpx };
})();

    return {

      wrap: ({ SQUARE: 'square', TOP_AND_BOTTOM: 'block', IN_FRONT_OF_TEXT: 'front', BEHIND_TEXT: 'behind' })[el.getAttribute('textWrap')] || 'square',
      vrel: g('vertRelTo', 'PARA'), hrel: g('horzRelTo', 'COLUMN'), valign: g('vertAlign', 'TOP'), halign: g('horzAlign', 'LEFT'),
      vo: u32(g('vertOffset', 0)) / 75, ho: u32(g('horzOffset', 0)) / 75,
    };
  }
  const sizeOf = (el) => { const sz = kid(el, 'sz') || kid(el, 'curSz'); return { w: sz ? num(sz.getAttribute('width')) / 75 : 0, h: sz ? num(sz.getAttribute('height')) / 75 : 0 }; };
  // 떠 있는 개체 감싸개. 위치(data-pos)는 화면 배치 뒤 편집기에서 문단 기준 좌표로 바꾼다.
  function fobj(pl, w, h, inner, attrs = '') {
    const wrap = pl.wrap;
    let st = `width:${Math.round(w)}px;height:${Math.round(h)}px`;
    let al = '';
    if (wrap === 'square' || wrap === 'block') { al = ({ RIGHT: 'right', CENTER: 'center' })[pl.halign] || 'left'; }
    return `<span class="fobj" contenteditable="false" data-wrap="${wrap}"${al ? ` data-align="${al}"` : ''} data-pos="${[pl.vrel, pl.hrel, pl.valign, pl.halign, pl.vo.toFixed(1), pl.ho.toFixed(1)].join(',')}" style="${st}"${attrs}>${inner}</span>`;
  }
  async function shapeHtml(el, ctx) {
    const n = el.localName;
    const pl = placement(el); const { w, h } = sizeOf(el);
    const ls = kid(el, 'lineShape');
    const lsty = ls ? ls.getAttribute('style') : 'NONE';
    const stroke = ls && lsty !== 'NONE' && num(ls.getAttribute('width')) > 0 ? ls.getAttribute('color') : '';
    const sw = stroke ? Math.max(1, Math.round(num(ls.getAttribute('width')) / 75 * 10) / 10) : 0;
    const wb = desc(el, 'winBrush').find((b) => b.parentNode && b.parentNode.parentNode === el);
    let fill = wb ? wb.getAttribute('faceColor') : '';
    if (!fill || fill === 'none') fill = '';
    if (n === 'line') {
      const arrow = ls && /ARROW|SPEAR/.test(ls.getAttribute('tailStyle') || '');
      const col = stroke || '#000000'; const lw = sw || 1;
      const svg = `<svg width="100%" height="100%" viewBox="0 0 ${Math.max(1, w)} ${Math.max(lw * 4, 8)}" preserveAspectRatio="none"><line x1="0" y1="50%" x2="100%" y2="50%" stroke="${col}" stroke-width="${lw}"${lsty === 'DASH' ? ` stroke-dasharray="${lw * 3} ${lw * 2}"` : ''}/></svg>`;
      if (pl.inline) return { inline: `<span style="display:inline-block;width:${Math.round(w)}px;height:${Math.max(4, lw * 4)}px">${svg}</span>` };
      return { html: fobj(pl, w, Math.max(lw * 4, 8), svg, ` data-kind="line"${arrow ? ' data-arrow="1"' : ''}`) };
    }
    const dt = kid(el, 'drawText');
    let inner = '', va = 'TOP', pad = 0;
    if (dt) {
      const sl = kid(dt, 'subList'); va = sl ? sl.getAttribute('vertAlign') || 'TOP' : 'TOP';
      const tm = kid(dt, 'textMargin'); pad = tm ? num(tm.getAttribute('left')) / 75 : 0;
      if (sl) for (const ip of kids(sl, 'p')) inner += await renderPara(ip, ctx);
    } else {
      for (const sl of desc(el, 'subList')) for (const ip of kids(sl, 'p')) inner += await renderPara(ip, ctx);
    }
    const hasText = inner.replace(/<[^>]+>|&nbsp;|\s/g, '');
    // 그림으로 채운 도형(로고 등)은 그림 개체로
    const fb = kid(el, 'fillBrush'); const ib = fb && kid(fb, 'imgBrush'); const bimg = ib && desc(ib, 'img')[0];
    if (bimg && !hasText) {
      const src = await ctx.imgData(bimg.getAttribute('binaryItemIDRef'));
      if (src && src !== 'unsupported') {
        if (pl.inline) return { inline: `<img src="${src}" width="${Math.round(w)}" height="${Math.round(h)}" alt="">` };
