<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HWP 편집실</title>
<meta name="description" content="한글(HWP·HWPX) 문서를 브라우저에서 열고 편집해 HWPX·HWP·DOCX·PDF 등으로 저장하는 편집기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
/* 레이아웃: 상단 파일 막대 + 서식 리본 + 흰 작업면 위 실제 용지 크기 쪽 + 하단 상태줄 */
:root {
  --bg: #ffffff;          /* 작업면 (항상 흰색) */
  --ink: #1b2333;         /* 본문 글자 */
  --ink-2: #5b6578;       /* 보조 글자 */
  --line: #e3e7ee;        /* 구분선 */
  --line-2: #cfd6e2;
  --tint: #f4f6fa;        /* 버튼 눌림·호버 */
  --accent: #1f4fbf;      /* 한컴 파랑 계열 */
  --accent-ink: #ffffff;
  --accent-soft: #e8eefb;
  --warn: #b45309;
  --danger: #b42318;
  --ok: #157f3b;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --doc: "함초롬바탕", "HCR Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); margin: 0; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100%; }

/* 상단 파일 막대 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.docname { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.docname input { min-width: 0; flex: 1; max-width: 420px; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-size: 14px; font-weight: 500; background: transparent; }
.docname input:hover { border-color: var(--line); }
.docname input:focus { outline: none; border-color: var(--accent); background: #fff; }
.fmt-chip { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: none; }
.app.dirty .dirty-dot { display: inline-block; }
.file-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: #fff; border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { background: #1a43a6; }
.btn svg { width: 15px; height: 15px; flex: none; }

/* 서식 리본 */
.ribbon { display: flex; align-items: center; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); flex: none; }
.grp:last-child { border-right: 0; }
.tb { width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; display: grid; place-items: center; position: relative; flex: none; }
.tb:hover { background: var(--tint); }
.tb.on { background: var(--accent-soft); border-color: #c5d3f3; color: var(--accent); }
.tb svg { width: 17px; height: 17px; }
.tb .sw { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 1px; }
.tb.wide { width: auto; padding: 0 8px; gap: 5px; display: inline-flex; }
.sel { height: 30px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; padding: 0 6px; cursor: pointer; }
.sel:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
#fontSel { width: 128px; } #sizeSel { width: 62px; } #styleSel { width: 84px; } #lhSel { width: 72px; }

/* 상황 막대(표·그림) */
.ctxbar { display: flex; align-items: center; gap: 4px; padding: 5px 16px; border-bottom: 1px solid var(--line); background: #fafbfd; overflow-x: auto; flex-wrap: nowrap; }
.ctxbar .label { font-size: 12px; font-weight: 600; color: var(--accent); margin-right: 6px; white-space: nowrap; }
.ctxbar .btn { padding: 4px 9px; font-size: 12px; }
.ctxbar input[type=number] { width: 70px; height: 28px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; }

/* 작업면 */
.workspace { flex: 1; overflow: auto; position: relative; background: var(--bg); }
.workspace.drop { outline: 3px dashed var(--accent); outline-offset: -10px; }
#zoomWrap { padding: 28px 16px 60px; width: max-content; min-width: 100%; box-sizing: border-box; }
.sheet { position: relative; margin: 0 auto; width: max-content; }
.page { box-sizing: border-box; background: #fff; border: 1px solid var(--line-2); box-shadow: 0 1px 2px rgba(27,35,51,.06), 0 8px 28px rgba(27,35,51,.07);
  font-family: var(--doc); font-size: 10pt; line-height: 1.6; color: #000; text-align: justify; word-break: keep-all; overflow-wrap: anywhere; outline: none; tab-size: 4; caret-color: #000; }
.page p, .page h1, .page h2, .page h3, .page li, .page div { margin: 0; }
.page h1 { font-size: 18pt; font-weight: bold; margin: 6pt 0; line-height: 1.4; }
.page h2 { font-size: 15pt; font-weight: bold; margin: 5pt 0; line-height: 1.4; }
.page h3 { font-size: 12pt; font-weight: bold; margin: 4pt 0; line-height: 1.4; }
.page blockquote { margin: 0 0 0 10mm; padding-left: 3mm; border-left: 2px solid #bbb; }
.page ul, .page ol { margin: 0; padding-left: 7mm; }
.page table { border-collapse: collapse; margin: 1px 0; table-layout: fixed; max-width: 100%; }
.page td, .page th { border: 1px solid #000; padding: .5mm 1.8mm; vertical-align: middle; min-width: 8px; word-break: keep-all; overflow-wrap: anywhere; }
.page table.noborder td { border: 1px dotted #c6cdd9; }
.page td.cell-sel { box-shadow: inset 0 0 0 2px rgba(31,79,191,.45); }
.page img { max-width: 100%; vertical-align: bottom; }
.page img.img-sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.page .tab { white-space: pre; }
.page .textbox { outline: 1px dashed #c6cdd9; outline-offset: 1px; padding: 1mm 2mm; margin: 1mm 0; }
.page .eq { font-family: var(--mono); font-size: .92em; background: #f1f3f7; padding: 0 3px; border-radius: 3px; }
.page .ph { color: #8a93a3; font-size: .9em; }
.page .pagebreak { height: 0; border-top: 1px dashed #8fa6dc; margin: 8px 0; position: relative; user-select: none; }
.page .pagebreak::after { content: "쪽 나누기"; position: absolute; right: 0; top: -9px; font: 10px var(--ui); color: var(--accent); background: #fff; padding: 0 4px; }
.page ::selection { background: #c9d7f7; }
.markers { position: absolute; inset: 0; pointer-events: none; }
.marker { position: absolute; left: -1px; right: -1px; height: 0; border-top: 1px dashed #c8d0de; }
.marker span { position: absolute; right: -54px; top: -8px; font: 11px var(--ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 상태줄 */
.status { display: flex; align-items: center; gap: 16px; padding: 5px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); flex-wrap: wrap; padding-bottom: calc(5px + env(safe-area-inset-bottom, 0px)); }
.status .sp { flex: 1; }
.status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.status .chip { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 1px 9px; cursor: pointer; font-size: 12px; }
.status .chip:hover { background: var(--tint); }
.zoom { display: flex; align-items: center; gap: 4px; }
.zoom select { height: 24px; border: 1px solid var(--line-2); border-radius: 5px; background: #fff; }

/* 펼침 메뉴·팝오버 */
.pop { position: fixed; z-index: 50; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 34px rgba(27,35,51,.16); padding: 6px; min-width: 200px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--tint); outline: none; }
.menu-item .ext { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); }
.menu-item small { display: block; color: var(--ink-2); font-size: 11px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-head { font-size: 11px; color: var(--ink-2); padding: 6px 10px 4px; letter-spacing: .04em; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; padding: 4px; }
.swatches button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
.swatches button:hover { transform: scale(1.12); }
.pop-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px 2px; font-size: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; padding: 6px; }
.tgrid i { width: 18px; height: 18px; border: 1px solid var(--line-2); border-radius: 3px; display: block; cursor: pointer; }
.tgrid i.on { background: var(--accent-soft); border-color: var(--accent); }
.tgrid-label { text-align: center; font-size: 12px; color: var(--ink-2); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.chars { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; padding: 4px; }
.chars button { height: 30px; border: 1px solid transparent; background: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
.chars button:hover { background: var(--tint); border-color: var(--line); }

/* 찾기 패널 */
.findbar { position: absolute; top: 10px; right: 18px; z-index: 30; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 8px 26px rgba(27,35,51,.14); padding: 10px; display: grid; gap: 6px; width: min(340px, calc(100vw - 40px)); }
.findbar .row { display: flex; gap: 6px; align-items: center; }
.findbar input[type=text] { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; }
.findbar .btn { padding: 4px 9px; font-size: 12px; }
.findbar .count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 대화상자 */
.modal-back { position: fixed; inset: 0; background: rgba(27,35,51,.28); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(27,35,51,.25); width: min(460px, 100%); padding: 20px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-2); line-height: 1.6; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field input, .field select { height: 32px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
.field.full { grid-column: 1 / -1; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 6px; cursor: pointer; font-size: 13px; color: var(--ink); }
.seg input { display: none; }
.seg input:checked + span { color: var(--accent); font-weight: 600; }
.seg label:has(input:checked) { background: var(--accent-soft); }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 80; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 26px rgba(0,0,0,.2); max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast.err { background: var(--danger); }
.toast button { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.busy { position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.72); display: grid; place-items: center; }
.busy-box { background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 18px 22px; box-shadow: 0 12px 40px rgba(27,35,51,.15); display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { display: flex; gap: 10px; align-items: center; padding: 8px 16px; background: #fff7e8; border-bottom: 1px solid #f3dfb5; font-size: 13px; flex-wrap: wrap; }
.banner .sp { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
@media (max-width: 640px) {
  .topbar { padding: 8px 12px; gap: 8px; }
  .brand span:last-child { display: none; }
  .file-actions .btn .lbl-long { display: none; }
  #zoomWrap { padding: 16px 16px 48px; }
  .marker span { display: none; }
  #stInfo { display: none; }
}
@media print {
  body { overflow: visible; height: auto; }
  .app { display: block; height: auto; }
  .topbar, .ribbon, .ctxbar, .status, .banner, .findbar, .markers, .toast { display: none !important; }
  .workspace { overflow: visible; }
  #zoomWrap { padding: 0; zoom: 1 !important; }
  .page { border: 0; box-shadow: none; min-height: 0 !important; }
  .page .pagebreak { border: 0; break-after: page; margin: 0; }
  .page .pagebreak::after { content: none; }
  .page td.cell-sel { box-shadow: none; }
  .page table.noborder td { border-color: transparent; }
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">한</div><span>HWP 편집실</span></div>
    <div class="docname">
      <input id="docName" type="text" value="새 문서" aria-label="문서 이름" spellcheck="false">
      <span class="dirty-dot" title="저장하지 않은 변경 사항이 있습니다"></span>
      <span class="fmt-chip" id="fmtChip">새 문서</span>
    </div>
    <div class="file-actions">
      <button class="btn" id="btnNew" title="새 문서 (Alt+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span class="lbl-long">새 문서</span></button>
      <button class="btn" id="btnOpen" title="열기 (Ctrl+O) — HWP·HWPX·DOCX·HTML·TXT·MD"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>열기</button>
      <button class="btn primary" id="btnSave" title="HWPX로 저장 (Ctrl+S) — 한글 2014 이상에서 바로 열림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 3h11l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>저장<span class="lbl-long">&nbsp;(HWPX)</span></button>
      <button class="btn" id="btnExport" aria-haspopup="menu" title="다른 형식으로 저장·내보내기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl-long">다른 형식으로</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px"><path d="m6 9 6 6 6-6"/></svg></button>
      <input type="file" id="fileInput" accept=".hwp,.hwpx,.docx,.html,.htm,.txt,.md,.markdown" hidden>
      <input type="file" id="imgInput" accept="image/*" multiple hidden>
    </div>
  </header>

  <div class="banner" id="restoreBanner" hidden>
    <span>이전에 편집하던 문서 <b id="restoreName"></b>가 자동 보관되어 있습니다 (<span id="restoreTime"></span>).</span>
    <span class="sp"></span>
    <button class="btn" id="btnRestore">이어서 편집</button>
    <button class="btn" id="btnDiscard">지우기</button>
  </div>

  <nav class="ribbon" id="ribbon" aria-label="서식">
    <div class="grp">
      <button class="tb" data-cmd="undo" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb" data-cmd="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="grp">
      <select class="sel" id="styleSel" title="문단 스타일">
        <option value="p">바탕글</option><option value="h1">제목 1</option><option value="h2">제목 2</option><option value="h3">제목 3</option><option value="blockquote">인용</option>
      </select>
      <select class="sel" id="fontSel" title="글꼴"></select>
      <select class="sel" id="sizeSel" title="글자 크기(pt)"></select>
      <button class="tb" id="sizeDown" title="글자 작게 (Ctrl+[)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 18 9 6l5 12M5.6 14h6.8M16 12h5"/></svg></button>
      <button class="tb" id="sizeUp" title="글자 크게 (Ctrl+])"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 18 8 6l5 12M4.6 14h6.8M15 12h6M18 9v6"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" data-cmd="bold" title="진하게 (Ctrl+B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"/></svg></button>
      <button class="tb" data-cmd="italic" title="기울임 (Ctrl+I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 5h-4M14 19h-4M14.5 5l-5 14"/></svg></button>
      <button class="tb" data-cmd="underline" title="밑줄 (Ctrl+U)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 4v7a5 5 0 0 0 10 0V4M5 20h14"/></svg></button>
      <button class="tb" data-cmd="strikeThrough" title="취소선"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 12h16M16 7a4 3 0 0 0-8 0c0 1.5 1.3 2.4 4 3M8 17a4 3 0 0 0 8 0"/></svg></button>
      <button class="tb" data-cmd="superscript" title="위 첨자"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m4 8 8 10M12 8l-8 10M16 4h4l-4 5h4"/></svg></button>
      <button class="tb" data-cmd="subscript" title="아래 첨자"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m4 5 8 10M12 5l-8 10M16 15h4l-4 5h4"/></svg></button>
      <button class="tb" id="btnColor" title="글자 색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m6 16 6-12 6 12M8 12h8"/></svg><i class="sw" id="colorSw" style="background:#c0392b"></i></button>
      <button class="tb" id="btnHilite" title="형광펜(음영)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 15 7-11 3 2-7 11zM9 15l-2 3 3 .5 2-1.5"/></svg><i class="sw" id="hiliteSw" style="background:#ffe14d"></i></button>

    return '#' + p.slice(0, 3).map((x) => Math.round(x).toString(16).padStart(2, '0')).join('').toUpperCase();

          c += cs;
        });

      const cols = Math.max(1, ...grid.map((r) => r ? r.length : 0));
      // 빈 칸(행마다 칸 수가 다른 표)은 빈 셀로 채워 격자를 완성
      for (let ri = 0; ri < grid.length; ri++) {
        grid[ri] = grid[ri] || [];

          if (grid[ri][c]) continue;

          rows[ri].push({ r: ri, c, cs: 1, rs: 1, w: 0, h: 0, bg: null, border: rows[ri][0] ? rows[ri][0].border : true, va: 'CENTER',

/* ===== 라이브러리 지연 로더 + HWP 변환 엔진(Pyodide + python-hwpx, Apache-2.0) ===== */
const Loader = (() => {
  const LIBS = {
    html2canvas: ['https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', 'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'],
    jspdf: ['https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'],
    mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js'],
  };
  const GLOBAL = { html2canvas: 'html2canvas', jspdf: 'jspdf', mammoth: 'mammoth' };
  const done = {};
  function script(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = url; s.async = true;
      s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('불러오기 실패: ' + url)); };
      document.head.appendChild(s);
    });
  }
  async function need(name) {
    if (window[GLOBAL[name]]) return;
    if (done[name]) return done[name];
    done[name] = (async () => {
      let err;
      for (const u of LIBS[name]) { try { await script(u); if (window[GLOBAL[name]]) return; } catch (e) { err = e; } }
      done[name] = null;
      throw new Error('인터넷 연결을 확인해 주세요. 필요한 구성요소(' + name + ')를 불러오지 못했습니다.');
    })();
    return done[name];
  }
  return { need, script };
})();

const Engine = (() => {
  const BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
  const GLUE = `
import zipfile
from hwpx.hwp5.writer import write_hwp5
from hwpx.hwp5.package import convert, to_hwpx_bytes

def to_hwp(src, dst):
    z = zipfile.ZipFile(src)
    files = {n: z.read(n) for n in z.namelist()}
    data = write_hwp5(files)
    with open(dst, 'wb') as f:
        f.write(data)

def to_hwpx(src, dst):
    with open(src, 'rb') as f:
        c = convert(f.read())
    with open(dst, 'wb') as f:
        f.write(to_hwpx_bytes(c.files))
`;
  let py = null, loading = null;
  function ready() { return !!py; }
  async function load(status = () => {}) {
    if (py) return py;
    if (loading) return loading;
    loading = (async () => {
      status('HWP 엔진 내려받는 중… (처음 한 번만, 약 15MB)');
      if (!window.loadPyodide) await Loader.script(BASE + 'pyodide.js');
      const p = await window.loadPyodide({ indexURL: BASE });
      status('문서 처리 모듈 준비 중…');
      await p.loadPackage(['micropip', 'lxml']);
      status('HWP 변환기 설치 중…');
      const mp = p.pyimport('micropip');
      await mp.install('python-hwpx==6.8.0');
      await p.runPythonAsync(GLUE);
      py = p; return p;
    })();
    try { return await loading; } catch (e) { loading = null; throw e; }
  }
  async function hwpxToHwp(u8, status) {
    const p = await load(status);
    status && status('HWP 파일로 변환 중…');
    p.FS.writeFile('/tmp/in.hwpx', u8);
    p.runPython('to_hwp("/tmp/in.hwpx", "/tmp/out.hwp")');
    return p.FS.readFile('/tmp/out.hwp');
  }
  async function hwpToHwpx(u8, status) {
    const p = await load(status);
    status && status('HWP 문서 정밀 변환 중…');
    p.FS.writeFile('/tmp/in.hwp', u8);
    p.runPython('to_hwpx("/tmp/in.hwp", "/tmp/out.hwpx")');
    return p.FS.readFile('/tmp/out.hwpx');
  }
  return { load, ready, hwpxToHwp, hwpToHwpx };
})();

const HWPReader = (() => {
  const T = { // HWPTAG_BEGIN = 16
    ID_MAPPINGS: 17, BIN_DATA: 18, FACE_NAME: 19, BORDER_FILL: 20, CHAR_SHAPE: 21, PARA_SHAPE: 25,
    PARA_HEADER: 66, PARA_TEXT: 67, PARA_CHAR_SHAPE: 68, CTRL_HEADER: 71, LIST_HEADER: 72,
    PAGE_DEF: 73, TABLE: 77, SHAPE_COMPONENT: 76, SHAPE_PICTURE: 85, EQEDIT: 88,
  };

    if (im.ext === 'wmf' || im.ext === 'emf') return `<span class="ph" title="WMF/EMF 그림은 표시할 수 없습니다">[그림]</span>`;

  function renderGso(node, info, images, page) {
    const d = dv(node.data);

    const h = node.data.length >= 24 ? d.getUint32(20, true) / 75 : 0;

    let inline = '';

      if (pr.data.length < 73) continue;

    for (const c of root.children) { if (c === target) return root; const f = findParent(c, target); if (f) return f; }
    return null;
  }

  function renderTable(node, info, images, page) {

    if (tb && tb.data.length >= 8) { const d = dv(tb.data); rows = d.getUint16(4, true); cols = d.getUint16(6, true); }
    const cells = [];
    const kids = node.children;
    for (let k = 0; k < kids.length; k++) {
      const lh = kids[k];
      if (lh.tag !== T.LIST_HEADER) continue;

      if (lh.data.length >= 34) {
        cell.col = d.getUint16(8, true); cell.row = d.getUint16(10, true);
        cell.cs = d.getUint16(12, true) || 1; cell.rs = d.getUint16(14, true) || 1;

      }
      let paras = lh.children.filter((c) => c.tag === T.PARA_HEADER);
      if (!paras.length) for (let j = k + 1; j < kids.length && kids[j].tag === T.PARA_HEADER; j++) paras.push(kids[j]);

    byRow.forEach((r) => r.sort((a, b) => a.col - b.col));

    cells.forEach((c) => { if (c.cs === 1 && c.col < colW.length && c.w) colW[c.col] = Math.max(colW[c.col], c.w); });
    const total = colW.reduce((a, b) => a + b, 0);
    let html = '<table class="hwp-table"';
    html += total ? ` style="width:${Math.round(total / 75)}px">` : '>';
    if (total && colW.every((x) => x > 0)) html += '<colgroup>' + colW.map((w) => `<col style="width:${Math.round(w / 75)}px">`).join('') + '</colgroup>';
    for (const r of byRow) {
      html += '<tr>';
      for (const c of r) {
        const bf = info.borderFills[c.bf - 1];
        const st = [];
        if (bf && bf.fill && bf.fill !== '#ffffff') st.push('background-color:' + bf.fill);
        if (bf && bf.borders.every((b) => b === 0)) st.push('border-style:dotted;border-color:#d6dae3');

        html += `<td${c.cs > 1 ? ` colspan="${c.cs}"` : ''}${c.rs > 1 ? ` rowspan="${c.rs}"` : ''}${st.length ? ` style="${st.join(';')}"` : ''}>${c.html}</td>`;

    }

  }

    const g = (n) => m ? mm(m.getAttribute(n)) : 0;
    ctx.page = { w: mm(pp.getAttribute('width')), h: mm(pp.getAttribute('height')), landscape: pp.getAttribute('landscape') === 'NARROWLY',
      ml: g('left'), mr: g('right'), mt: g('top'), mb: g('bottom'), hd: g('header'), ft: g('footer') };
  }

  async function renderPara(p, ctx) {
    const { H } = ctx;
    const pp = H.paras[p.getAttribute('paraPrIDRef')];
    const pst = paraStyle(pp);
    const blocks = []; let cur = '';
    const pageBreak = p.getAttribute('pageBreak') === '1' || (pp && pp.breakBefore);
    const flush = (force) => { if (cur || force) blocks.push({ t: 'p', html: cur }); cur = ''; };
    let hadText = false;
    for (const run of kids(p, 'run')) {
      const st = charStyle(H.chars[run.getAttribute('charPrIDRef')]);
      for (const el of Array.from(run.children)) {
        const n = el.localName;
        if (n === 't') {
          let s = '';
          for (const node of Array.from(el.childNodes)) {
            if (node.nodeType === 3) s += esc(node.nodeValue);
            else if (node.nodeType === 1) {
              const ln = node.localName;
              if (ln === 'tab') s += '<span class="tab">\t</span>';
              else if (ln === 'lineBreak') s += '<br>';
              else if (ln === 'nbSpace' || ln === 'fwSpace') s += '&nbsp;';
              else if (ln === 'hyphen') s += '-';
              else if (node.textContent) s += esc(node.textContent);
            }
          }
          if (s) { hadText = true; s = s.replace(/ {2}/g, ' &nbsp;'); cur += st ? `<span style="${st}">${s}</span>` : s; }
        } else if (n === 'secPr') readSecPr(el, ctx);
        else if (n === 'tbl') { flush(false); blocks.push({ t: 'raw', html: await renderTable(el, ctx) }); }
        else if (n === 'pic') {
          const img = desc(el, 'img')[0];
          const sz = kid(el, 'curSz') || kid(el, 'sz');
          const w = sz ? num(sz.getAttribute('width')) / 75 : 0, h = sz ? num(sz.getAttribute('height')) / 75 : 0;
          const src = img ? await ctx.imgData(img.getAttribute('binaryItemIDRef')) : null;
          if (src === 'unsupported') cur += '<span class="ph" title="WMF/EMF 그림은 표시할 수 없습니다">[그림]</span>';
          else if (src) cur += `<img src="${src}"${w && h ? ` width="${Math.round(w)}" height="${Math.round(h)}"` : ''} alt="">`;
        } else if (n === 'equation') {
          const sc = desc(el, 'script')[0];
          if (sc) cur += `<span class="eq" title="수식">${esc(sc.textContent)}</span>`;
        } else if (['rect', 'ellipse', 'polygon', 'container', 'curve', 'arc'].includes(n)) {
          // 글상자 안의 문단만 살림
          const sub = desc(el, 'subList');
          let inner = '';
          for (const sl of sub) for (const ip of kids(sl, 'p')) inner += await renderPara(ip, ctx);
          if (inner.replace(/<[^>]+>|&nbsp;|\s/g, '')) { flush(false); blocks.push({ t: 'raw', html: `<div class="textbox">${inner}</div>` }); }
        }
      }
    }
    flush(!blocks.length);
    let out = ''; let first = true;
    for (const b of blocks) {
      let h = b.t === 'raw' ? b.html : `<p style="${pst}">${b.html || '<br>'}</p>`;
      if (first && pageBreak) h = h.replace(/^<(p|table|div)/, '<$1 class="pb-before"');
      out += h; first = false;
    }
    return out;
  }

  async function renderTable(tbl, ctx) {
    const { H } = ctx;
    const tblBf = H.bfs[tbl.getAttribute('borderFillIDRef')];
    const rows = kids(tbl, 'tr');
    // 열 너비
    const colCnt = num(tbl.getAttribute('colCnt'), 0);
    const colW = new Array(colCnt).fill(0);
    for (const tr of rows) for (const tc of kids(tr, 'tc')) {
      const a = kid(tc, 'cellAddr'), sp = kid(tc, 'cellSpan'), sz = kid(tc, 'cellSz');
      if (a && sp && sz && num(sp.getAttribute('colSpan'), 1) === 1) {
        const c = num(a.getAttribute('colAddr')); if (c < colCnt) colW[c] = Math.max(colW[c], num(sz.getAttribute('width')));
      }
    }
    const total = colW.reduce((a, b) => a + b, 0);
    let html = `<table class="hwp-table${tblBf && tblBf.none ? ' noborder' : ''}"${total ? ` style="width:${Math.round(total / 75)}px"` : ''}>`;
    if (total && colW.every((x) => x > 0)) html += '<colgroup>' + colW.map((w) => `<col style="width:${Math.round(w / 75)}px">`).join('') + '</colgroup>';
    for (const tr of rows) {
      html += '<tr>';
      for (const tc of kids(tr, 'tc')) {
        const sp = kid(tc, 'cellSpan'), sz = kid(tc, 'cellSz');
        const cs = sp ? num(sp.getAttribute('colSpan'), 1) : 1, rs = sp ? num(sp.getAttribute('rowSpan'), 1) : 1;
        const bf = H.bfs[tc.getAttribute('borderFillIDRef')];
        const st = [];
        if (bf && bf.fill) st.push('background-color:' + bf.fill);
        if (bf && bf.none) st.push('border-style:dotted;border-color:#d6dae3');
        if (sz && num(sz.getAttribute('height'))) st.push('height:' + Math.round(num(sz.getAttribute('height')) / 75) + 'px');
        const sl = kid(tc, 'subList');
        const va = sl ? (sl.getAttribute('vertAlign') || 'CENTER') : 'CENTER';
        st.push('vertical-align:' + ({ TOP: 'top', CENTER: 'middle', BOTTOM: 'bottom' }[va] || 'middle'));
        let inner = '';
        if (sl) for (const ip of kids(sl, 'p')) inner += await renderPara(ip, ctx);
        html += `<td${cs > 1 ? ` colspan="${cs}"` : ''}${rs > 1 ? ` rowspan="${rs}"` : ''} style="${st.join(';')}">${inner || '<p><br></p>'}</td>`;
      }
      html += '</tr>';
    }
    return html + '</table>';
  }

  return { read };
})();

/* ---- hwpx-write.js ---- */
/* ===== 문서 모델 → HWPX 패키지 =====
 * 한컴 OWPML 구조를 따르는 검증된 빈 문서(Skeleton.hwpx)를 바탕으로
 * header.xml에 글자모양·문단모양·테두리를 추가하고 section0.xml 본문을 새로 쓴다.
 */
const HWPXWriter = (() => {
  const X = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const HU = 75; // 1px(96dpi) = 75 HWPUNIT
  const MM = 283.465;

  function b64ToU8(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

  async function dataUrlToImage(src) {
    // png/jpg/gif/bmp는 그대로, 그 외는 PNG로 변환
    let mime = '', bytes = null;
    const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(src || '');
    if (m) {
      mime = m[1].toLowerCase();
      bytes = m[2] ? b64ToU8(m[3]) : new TextEncoder().encode(decodeURIComponent(m[3]));
    } else {
      try { const r = await fetch(src); const b = await r.blob(); mime = b.type; bytes = new Uint8Array(await b.arrayBuffer()); } catch (e) { return null; }
    }
    const ok = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/gif': 'gif', 'image/bmp': 'bmp' }[mime];
    if (ok) return { bytes, ext: ok, mime: mime === 'image/jpg' ? 'image/jpeg' : mime };
    // 변환
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const cv = document.createElement('canvas'); cv.width = img.naturalWidth || 300; cv.height = img.naturalHeight || 150;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const png = await new Promise((res) => cv.toBlob(res, 'image/png'));
      return { bytes: new Uint8Array(await png.arrayBuffer()), ext: 'png', mime: 'image/png' };
    } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
  }

  async function build(blocks, page, meta = {}) {
    const skel = await JSZip.loadAsync(b64ToU8(SKELETON_B64));
    const files = {};
    for (const name of Object.keys(skel.files)) {
      if (skel.files[name].dir) continue;
      files[name] = await skel.file(name).async(name.endsWith('.png') ? 'uint8array' : 'string');
    }
    let header = files['Contents/header.xml'];
    const sec = files['Contents/section0.xml'];

    // --- 글꼴 ---
    const fontIds = {}; // 이름 → id
    const fontfaceRe = /<hh:fontface lang="([A-Z]+)" fontCnt="(\d+)">([\s\S]*?)<\/hh:fontface>/g;
    const existing = {};
    header.replace(fontfaceRe, (m, lang, cnt, body) => {
      if (lang === 'HANGUL') body.replace(/<hh:font id="(\d+)" face="([^"]*)"/g, (mm, id, face) => { existing[face] = +id; });
      return m;
    });
    let baseFontCount = Object.keys(existing).length;
    const newFonts = [];
    function fontId(name) {
      if (!name) return 1; // 함초롬바탕
      if (existing[name] !== undefined) return existing[name];
      if (fontIds[name] !== undefined) return fontIds[name];
      const id = baseFontCount + newFonts.length; newFonts.push(name); fontIds[name] = id; return id;
    }

    // --- 테두리/배경 ---
    const bfList = []; // xml strings; skeleton has 2 (1,2)
    const bfKey = {};
    function borderFill(border, fill) {
      const key = (border ? 'S' : 'N') + (fill || '');
      if (bfKey[key]) return bfKey[key];
      const id = 3 + bfList.length;
      const side = (n) => `<hh:${n} type="${border ? 'SOLID' : 'NONE'}" width="0.12 mm" color="#000000"/>`;
      const fillXml = fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : '';
      bfList.push(`<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>${side('leftBorder')}${side('rightBorder')}${side('topBorder')}${side('bottomBorder')}<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>${fillXml}</hh:borderFill>`);
      bfKey[key] = id; return id;
    }

    // --- 글자모양 ---
    const charBase = (header.match(/<hh:charProperties itemCnt="(\d+)">/) || [0, 7])[1] | 0;
    const charList = []; const charKey = {};
    function charPr(r) {
      const o = { b: !!r.b, i: !!r.i, u: !!r.u, s: !!r.s, sup: !!r.sup, sub: !!r.sub, color: r.color || '#000000', bg: r.bg || '', size: r.size || 10, font: r.font || '' };
      const key = JSON.stringify(o);
      if (charKey[key] !== undefined) return charKey[key];
      const id = charBase + charList.length;
      const f = fontId(o.font);
      const seven = (v) => `hangul="${v}" latin="${v}" hanja="${v}" japanese="${v}" other="${v}" symbol="${v}" user="${v}"`;
      let x = `<hh:charPr id="${id}" height="${Math.round(o.size * 100)}" textColor="${o.color}" shadeColor="${o.bg || 'none'}" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">`;
      x += `<hh:fontRef ${seven(f)}/><hh:ratio ${seven(100)}/><hh:spacing ${seven(0)}/><hh:relSz ${seven(100)}/><hh:offset ${seven(0)}/>`;
      if (o.i) x += '<hh:italic/>';
      if (o.b) x += '<hh:bold/>';
      x += `<hh:underline type="${o.u ? 'BOTTOM' : 'NONE'}" shape="SOLID" color="#000000"/>`;
      x += `<hh:strikeout shape="${o.s ? 'SOLID' : 'NONE'}" color="#000000"/>`;
      x += '<hh:outline type="NONE"/><hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/>';
      if (o.sup) x += '<hh:supscript/>'; else if (o.sub) x += '<hh:subscript/>';
      x += '</hh:charPr>';
      charList.push(x); charKey[key] = id; return id;
    }

    // --- 문단모양 ---
    const paraBase = (header.match(/<hh:paraProperties itemCnt="(\d+)">/) || [0, 20])[1] | 0;
    const paraList = []; const paraKey = {};
    function paraPr(b) {
      const o = {
        align: ({ left: 'LEFT', right: 'RIGHT', center: 'CENTER', justify: 'JUSTIFY' })[b.align] || 'JUSTIFY',
        lh: b.lh || 160, ml: Math.round(Math.max(0, (b.ml || 0) + Math.min(0, b.ti || 0)) * HU), mr: Math.round((b.mr || 0) * HU), ti: Math.round((b.ti || 0) * HU),
        mt: Math.round((b.mt || 0) * HU), mb: Math.round((b.mb || 0) * HU),
      };
      const key = JSON.stringify(o);
      if (paraKey[key] !== undefined) return paraKey[key];
      const id = paraBase + paraList.length;
      const margin = (k) => `<hh:margin><hc:intent value="${o.ti * k}" unit="HWPUNIT"/><hc:left value="${o.ml * k}" unit="HWPUNIT"/><hc:right value="${o.mr * k}" unit="HWPUNIT"/><hc:prev value="${o.mt * k}" unit="HWPUNIT"/><hc:next value="${o.mb * k}" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${o.lh}" unit="HWPUNIT"/>`;
      const x = `<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR"><hh:align horizontal="${o.align}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/><hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="BREAK_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/><hh:autoSpacing eAsianEng="0" eAsianNum="0"/><hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${margin(1)}</hp:case><hp:default>${margin(2)}</hp:default></hp:switch><hh:border borderFillIDRef="2" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`;
      paraList.push(x); paraKey[key] = id; return id;
    }

    // --- 그림 ---
    const bins = []; // {id, name, bytes, mime}
    let objId = 1000000;
    const nextId = () => ++objId;
    let paraId = 3000000;

    const textWidth = Math.round((page.w - page.ml - page.mr) * MM);

    async function runXml(r) {
      if (r.img) {
        const im = await dataUrlToImage(r.img.src);
        if (!im) return '';
        const n = bins.length + 1;
        const id = 'BIN' + String(n).padStart(4, '0');
        bins.push({ id, name: `BinData/${id}.${im.ext}`, bytes: im.bytes, mime: im.mime });
        let w = Math.round(r.img.w * HU), h = Math.round(r.img.h * HU);
        if (w > textWidth) { h = Math.round(h * textWidth / w); w = textWidth; }
        const oid = nextId();
        return `<hp:pic textWrap="SQUARE" textFlow="BOTH_SIDES" reverse="0" id="${oid}" zOrder="0" numberingType="PICTURE" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${oid}"><hp:offset x="0" y="0"/><hp:orgSz width="${w}" height="${h}"/><hp:curSz width="${w}" height="${h}"/><hp:flip horizontal="0" vertical="0"/><hp:rotationInfo angle="0" centerX="${w >> 1}" centerY="${h >> 1}" rotateimage="1"/><hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo><hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:imgRect><hp:imgClip left="0" right="${w}" top="0" bottom="${h}"/><hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="${w}" dimheight="${h}"/><hc:img binaryItemIDRef="${id}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/><hp:sz width="${w}" height="${h}" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:shapeComment/></hp:pic>`;
      }
      return '';
    }

    // 연속된 같은 모양 런을 하나의 hp:run으로 합침
    async function runsXml(runs, fallbackStyle) {
      let out = ''; let cur = null; let buf = '';
      const close = () => { if (cur !== null) { out += `<hp:run charPrIDRef="${cur}"><hp:t>${buf}</hp:t></hp:run>`; } cur = null; buf = ''; };
      let lastStyle = fallbackStyle;
      for (const r of runs) {
        if (r.img) {
          close();
          out += `<hp:run charPrIDRef="${charPr(lastStyle || {})}">${await runXml(r)}</hp:run>`;
          continue;
        }
        let id, piece;
        if (r.br) { id = cur !== null ? cur : charPr(lastStyle || {}); piece = '<hp:lineBreak/>'; }
        else if (r.tab) { id = cur !== null ? cur : charPr(lastStyle || {}); piece = '<hp:tab/>'; }
        else { lastStyle = r; id = charPr(r); piece = X(r.text); }
        if (id !== cur) { close(); cur = id; }
        buf += piece;
      }
      close();
      if (!out) out = `<hp:run charPrIDRef="${charPr(fallbackStyle || {})}"><hp:t/></hp:run>`;
      return out;
    }

    function styleOf(b) {
      const t = b.runs && b.runs.find((r) => r.text);
      return t || { size: 10 };
    }

    async function tableXml(tb) {
      const total = Math.min(textWidth, Math.round(tb.colW.reduce((a, c) => a + c, 0) * HU));
      const sum = tb.colW.reduce((a, c) => a + c, 0) || 1;
      const colHU = tb.colW.map((c) => Math.max(200, Math.round(c / sum * total)));
      const rowHU = (tb.rowH || []).map((h) => Math.max(282, Math.round(h * HU)));
      const tblH = rowHU.reduce((a, b) => a + b, 0) || 282 * tb.rows.length;
      const tbf = borderFill(tb.border, null);
      const oid = nextId();
      let x = `<hp:tbl id="${oid}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${tb.nrows}" colCnt="${tb.cols}" cellSpacing="0" borderFillIDRef="${tbf}" noAdjust="0">`;
      x += `<hp:sz width="${colHU.reduce((a, b) => a + b, 0)}" widthRelTo="ABSOLUTE" height="${tblH}" heightRelTo="ABSOLUTE" protect="0"/>`;
      x += `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="${tb.align === 'center' ? 'CENTER' : 'LEFT'}" vertOffset="0" horzOffset="0"/><hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="141" bottom="141"/>`;
      for (let ri = 0; ri < tb.rows.length; ri++) {
        x += '<hp:tr>';
        for (const cell of tb.rows[ri]) {
          const w = colHU.slice(cell.c, cell.c + cell.cs).reduce((a, b) => a + b, 0);
          const h = rowHU.slice(cell.r, cell.r + cell.rs).reduce((a, b) => a + b, 0) || 282;
          const bf = borderFill(cell.border, cell.bg);
          let inner = '';
          for (const b of cell.blocks) inner += await blockXml(b, false);
          x += `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}"><hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${cell.va || 'CENTER'}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${inner}</hp:subList><hp:cellAddr colAddr="${cell.c}" rowAddr="${cell.r}"/><hp:cellSpan colSpan="${cell.cs}" rowSpan="${cell.rs}"/><hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="510" right="510" top="141" bottom="141"/></hp:tc>`;
        }
        x += '</hp:tr>';
      }
      return x + '</hp:tbl>';
    }

    async function blockXml(b, top, secRun) {
      const pid = ++paraId;
      if (b.t === 'table') {
        const pp = paraPr({ align: b.align === 'center' ? 'center' : 'left', lh: 160 });
        return `<hp:p id="${pid}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${b.pb ? 1 : 0}" columnBreak="0" merged="0">${secRun || ''}<hp:run charPrIDRef="${charPr({ size: 10 })}">${await tableXml(b)}</hp:run></hp:p>`;
      }
      const pp = paraPr(b);
      const runs = await runsXml(b.runs, styleOf(b));
      return `<hp:p id="${pid}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="${b.pb ? 1 : 0}" columnBreak="0" merged="0">${secRun || ''}${runs}</hp:p>`;
    }

    // --- 구역 설정(용지) ---
    const i0 = sec.indexOf('<hp:run charPrIDRef="0"><hp:secPr');
    const i1 = sec.indexOf('</hp:run>', sec.indexOf('</hp:ctrl>')) + '</hp:run>'.length;
    let secRun = sec.slice(i0, i1);
    const pw = Math.round(Math.min(page.w, page.h) * MM), ph = Math.round(Math.max(page.w, page.h) * MM);
    secRun = secRun.replace(/<hp:pagePr [^>]*>/, `<hp:pagePr landscape="${page.landscape ? 'NARROWLY' : 'WIDELY'}" width="${pw}" height="${ph}" gutterType="LEFT_ONLY">`)
      .replace(/<hp:margin [^>]*\/>/, `<hp:margin header="${Math.round(page.hd * MM)}" footer="${Math.round(page.ft * MM)}" gutter="0" left="${Math.round(page.ml * MM)}" right="${Math.round(page.mr * MM)}" top="${Math.round(page.mt * MM)}" bottom="${Math.round(page.mb * MM)}"/>`);
    const secHead = sec.slice(0, sec.indexOf('<hp:p '));

    let body = '';
    const list = blocks.length ? blocks : [{ t: 'p', align: 'justify', lh: 160, runs: [] }];
    for (let k = 0; k < list.length; k++) body += await blockXml(list[k], true, k === 0 ? secRun : '');
    files['Contents/section0.xml'] = secHead + body + '</hs:sec>';

    // --- header 갱신 ---
    if (newFonts.length) {
      header = header.replace(fontfaceRe, (m, lang, cnt, inner) => {
        const add = newFonts.map((n, k) => `<hh:font id="${+cnt + k}" face="${X(n)}" type="TTF" isEmbedded="0"/>`).join('');
        return `<hh:fontface lang="${lang}" fontCnt="${+cnt + newFonts.length}">${inner}${add}</hh:fontface>`;
      });
    }
    // 모든 언어 글꼴 개수가 같다는 전제(skeleton은 각 언어 동일) — fontRef id가 모든 언어에서 같은 이름을 가리킴
    if (bfList.length) {
      header = header.replace(/<hh:borderFills itemCnt="(\d+)">([\s\S]*?)<\/hh:borderFills>/, (m, c, inner) => `<hh:borderFills itemCnt="${+c + bfList.length}">${inner}${bfList.join('')}</hh:borderFills>`);
    }
    header = header.replace(/<hh:charProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:charProperties>/, (m, c, inner) => `<hh:charProperties itemCnt="${+c + charList.length}">${inner}${charList.join('')}</hh:charProperties>`);
    header = header.replace(/<hh:paraProperties itemCnt="(\d+)">([\s\S]*?)<\/hh:paraProperties>/, (m, c, inner) => `<hh:paraProperties itemCnt="${+c + paraList.length}">${inner}${paraList.join('')}</hh:paraProperties>`);
    files['Contents/header.xml'] = header;

    // --- 목록·메타 ---
    let hpf = files['Contents/content.hpf'];
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    hpf = hpf.replace(/<opf:title\/>|<opf:title>[^<]*<\/opf:title>/, `<opf:title>${X(meta.title || '')}</opf:title>`)
      .replace(/(<opf:meta name="creator" content="text">)[^<]*/, `$1${X(meta.author || '')}`)
      .replace(/(<opf:meta name="lastsaveby" content="text">)[^<]*/, `$1${X(meta.author || '')}`)
      .replace(/(<opf:meta name="CreatedDate" content="text">)[^<]*/, `$1${now}`)
      .replace(/(<opf:meta name="ModifiedDate" content="text">)[^<]*/, `$1${now}`)
      .replace(/(<opf:meta name="date" content="text">)[^<]*/, `$1${X(new Date().toLocaleString('ko-KR'))}`);
    if (bins.length) {
      hpf = hpf.replace('</opf:manifest>', bins.map((b) => `<opf:item id="${b.id}" href="${b.name}" media-type="${b.mime}" isEmbeded="1"/>`).join('') + '</opf:manifest>');
    }
    files['Contents/content.hpf'] = hpf;
    files['Preview/PrvText.txt'] = DocModel.plainText(blocks).slice(0, 1024) || ' ';

    // --- 압축(mimetype은 맨 앞, 무압축) ---
    const zip = new JSZip();
    zip.file('mimetype', 'application/hwp+zip', { compression: 'STORE' });
    const order = ['version.xml', 'Contents/header.xml', 'Contents/section0.xml', 'Preview/PrvText.txt', 'settings.xml', 'Preview/PrvImage.png', 'META-INF/container.rdf', 'Contents/content.hpf', 'META-INF/container.xml', 'META-INF/manifest.xml'];
    for (const n of order) if (files[n] !== undefined) zip.file(n, files[n], { compression: n === 'version.xml' || n.endsWith('.png') ? 'STORE' : 'DEFLATE' });
    for (const b of bins) zip.file(b.name, b.bytes, { compression: 'STORE' });
    return zip.generateAsync({ type: 'uint8array', mimeType: 'application/hwp+zip', compression: 'DEFLATE' });
  }

  return { build };
})();

/* ---- export.js ---- */
/* ===== 내보내기: DOCX · Markdown · TXT · HTML · PDF · PNG ===== */
const DOCXWriter = (() => {
  const X = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const TW = 15; // 1px = 15 twip
  const EMU = 9525;

  async function build(blocks, page, meta = {}) {
    const media = []; let docPrId = 1;
    const textW = Math.round((page.w - page.ml - page.mr) * 56.693);

    async function imgRun(r) {
      let mime = '', bytes;
      const m = /^data:([^;,]+);base64,(.*)$/s.exec(r.img.src || '');
      if (m) { mime = m[1]; const s = atob(m[2]); bytes = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i); }
      else { try { const b = await (await fetch(r.img.src)).blob(); mime = b.type; bytes = new Uint8Array(await b.arrayBuffer()); } catch (e) { return ''; } }
      let ext = { 'image/png': 'png', 'image/jpeg': 'jpeg', 'image/gif': 'gif', 'image/bmp': 'bmp' }[mime];
      if (!ext) {
        const conv = await HWPXWriterImage(r.img.src); if (!conv) return '';
        bytes = conv; ext = 'png';
      }
      const n = media.length + 1; const rid = 'rIdImg' + n;
      media.push({ name: `image${n}.${ext}`, bytes, rid });
      let cx = Math.round(r.img.w * EMU), cy = Math.round(r.img.h * EMU);
      const maxCx = textW * 635; if (cx > maxCx) { cy = Math.round(cy * maxCx / cx); cx = maxCx; }
      const id = docPrId++;
      return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="그림 ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="image${n}.${ext}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
    }

    function rPr(r) {
      let x = '';
      if (r.font) x += `<w:rFonts w:ascii="${X(r.font)}" w:hAnsi="${X(r.font)}" w:eastAsia="${X(r.font)}" w:cs="${X(r.font)}"/>`;
      if (r.b) x += '<w:b/><w:bCs/>';
      if (r.i) x += '<w:i/><w:iCs/>';
      if (r.s) x += '<w:strike/>';
      if (r.color) x += `<w:color w:val="${r.color.replace('#', '')}"/>`;
      if (r.size) x += `<w:sz w:val="${Math.round(r.size * 2)}"/><w:szCs w:val="${Math.round(r.size * 2)}"/>`;
      if (r.u) x += '<w:u w:val="single"/>';
      if (r.bg) x += `<w:shd w:val="clear" w:color="auto" w:fill="${r.bg.replace('#', '')}"/>`;
      if (r.sup) x += '<w:vertAlign w:val="superscript"/>'; else if (r.sub) x += '<w:vertAlign w:val="subscript"/>';
      return x ? `<w:rPr>${x}</w:rPr>` : '';
    }

    async function para(b) {
      let p = '<w:p><w:pPr>';
      if (b.pb) p += '<w:pageBreakBefore/>';
      p += `<w:spacing w:before="${Math.round((b.mt || 0) * TW)}" w:after="${Math.round((b.mb || 0) * TW)}" w:line="${Math.round((b.lh || 160) / 100 * 240 * 0.85)}" w:lineRule="auto"/>`;
      const ti = Math.round((b.ti || 0) * TW);
      if (b.ml || b.mr || ti) p += `<w:ind w:left="${Math.round((b.ml || 0) * TW)}" w:right="${Math.round((b.mr || 0) * TW)}"${ti >= 0 ? ` w:firstLine="${ti}"` : ` w:hanging="${-ti}"`}/>`;
      p += `<w:jc w:val="${({ left: 'left', right: 'right', center: 'center', justify: 'both' })[b.align] || 'both'}"/>`;
      const first = (b.runs || []).find((r) => r.text);
      if (first) p += rPr(first).replace('w:rPr>', 'w:rPr>').replace(/^<w:rPr>/, '<w:rPr>');
      p += '</w:pPr>';
      let last = first || {};
      for (const r of b.runs || []) {
        if (r.img) p += await imgRun(r);
        else if (r.br) p += `<w:r>${rPr(last)}<w:br/></w:r>`;
        else if (r.tab) p += `<w:r>${rPr(last)}<w:tab/></w:r>`;
        else { last = r; p += `<w:r>${rPr(r)}<w:t xml:space="preserve">${X(r.text)}</w:t></w:r>`; }
      }
      return p + '</w:p>';
    }

    async function table(tb) {
      const sum = tb.colW.reduce((a, c) => a + c, 0) || 1;
      const totalTw = Math.min(textW, Math.round(sum * TW));
      const colTw = tb.colW.map((c) => Math.max(100, Math.round(c / sum * totalTw)));
      const bstyle = tb.border ? 'single' : 'nil';
      const brd = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((s) => `<w:${s} w:val="${bstyle}" w:sz="4" w:space="0" w:color="000000"/>`).join('');
      let x = `<w:tbl><w:tblPr><w:tblW w:w="${colTw.reduce((a, b) => a + b, 0)}" w:type="dxa"/>${tb.align === 'center' ? '<w:jc w:val="center"/>' : ''}<w:tblBorders>${brd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${colTw.map((w) => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
      // 세로 병합 계산
      const covered = {}; // "r,c" -> {cs, owner}
      for (const row of tb.rows) for (const cell of row) for (let y = 1; y < cell.rs; y++) covered[(cell.r + y) + ',' + cell.c] = cell;
      for (let ri = 0; ri < tb.nrows; ri++) {
        const row = tb.rows[ri] || [];
        const h = tb.rowH && tb.rowH[ri] ? Math.round(tb.rowH[ri] * TW) : 0;
        x += '<w:tr>' + (h ? `<w:trPr><w:trHeight w:val="${h}"/></w:trPr>` : '');
        // 행의 칸을 열 순서대로 (원본 칸 + 세로병합 이어짐 칸)
        const items = row.map((c) => ({ c: c.c, cell: c, cont: false }));
        for (const key in covered) { const [r, c] = key.split(',').map(Number); if (r === ri) items.push({ c, cell: covered[key], cont: true }); }
        items.sort((a, b) => a.c - b.c);
        for (const it of items) {
          const cell = it.cell;
          const w = colTw.slice(cell.c, cell.c + cell.cs).reduce((a, b) => a + b, 0);
          let tcPr = `<w:tcW w:w="${w}" w:type="dxa"/>`;
          if (cell.cs > 1) tcPr += `<w:gridSpan w:val="${cell.cs}"/>`;
          if (cell.rs > 1) tcPr += it.cont ? '<w:vMerge/>' : '<w:vMerge w:val="restart"/>';
          if (cell.bg) tcPr += `<w:shd w:val="clear" w:color="auto" w:fill="${cell.bg.replace('#', '')}"/>`;
          tcPr += `<w:vAlign w:val="${({ TOP: 'top', BOTTOM: 'bottom' })[cell.va] || 'center'}"/>`;
          let inner = '';
          if (!it.cont) for (const b of cell.blocks) inner += await block(b);
          if (!inner.endsWith('</w:p>')) inner += '<w:p/>';
          x += `<w:tc><w:tcPr>${tcPr}</w:tcPr>${inner}</w:tc>`;
        }
        x += '</w:tr>';
      }
      return x + '</w:tbl>';
    }

    async function block(b) {
      if (b.t === 'table') return (b.pb ? '<w:p><w:r><w:br w:type="page"/></w:r></w:p>' : '') + await table(b);
      return para(b);
    }

    let body = '';
    for (const b of blocks) body += await block(b);
    if (!body.endsWith('</w:p>')) body += '<w:p/>';
    const pw = Math.round(page.w * 56.693), ph = Math.round(page.h * 56.693);
    const sect = `<w:sectPr><w:pgSz w:w="${pw}" w:h="${ph}"${page.landscape ? ' w:orient="landscape"' : ''}/><w:pgMar w:top="${Math.round((page.mt + page.hd) * 56.693)}" w:right="${Math.round(page.mr * 56.693)}" w:bottom="${Math.round((page.mb + page.ft) * 56.693)}" w:left="${Math.round(page.ml * 56.693)}" w:header="${Math.round(page.mt * 56.693)}" w:footer="${Math.round(page.mb * 56.693)}" w:gutter="0"/></w:sectPr>`;
    const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}${sect}</w:body></w:document>`;
    const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕" w:cs="맑은 고딕"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:lang w:val="en-US" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
    const exts = [...new Set(media.map((m) => m.name.split('.').pop()))];
    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${exts.map((e) => `<Default Extension="${e}" ContentType="image/${e}"/>`).join('')}<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
    const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${media.map((m) => `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join('')}</Relationships>`;
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(meta.title || '')}</dc:title><dc:creator>${X(meta.author || '')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
    const zip = new JSZip();
    zip.file('[Content_Types].xml', ct); zip.file('_rels/.rels', rels);
    zip.file('word/document.xml', doc); zip.file('word/styles.xml', styles); zip.file('word/_rels/document.xml.rels', docRels);
    zip.file('docProps/core.xml', core);
    for (const m of media) zip.file('word/media/' + m.name, m.bytes);
    return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  async function HWPXWriterImage(src) {
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
      const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      cv.getContext('2d').drawImage(img, 0, 0);
      const b = await new Promise((r) => cv.toBlob(r, 'image/png'));
      return new Uint8Array(await b.arrayBuffer());
    } catch (e) { return null; }
  }

  return { build };
})();

const TextExport = (() => {
  function md(blocks) {
    const out = [];
    const inline = (runs) => {
      let s = '';
      for (const r of runs) {
        if (r.br) { s += '  \n'; continue; }
        if (r.tab) { s += '\t'; continue; }
        if (r.img) { s += `![그림](${r.img.src})`; continue; }
        let t = r.text.replace(/([*_`\[\]\\|#])/g, '\\$1');
        const lead = t.match(/^\s*/)[0], trail = t.match(/\s*$/)[0];
        let core = t.trim();
        if (!core) { s += t; continue; }
        if (r.s) core = `~~${core}~~`;
        if (r.i) core = `*${core}*`;
        if (r.b) core = `**${core}**`;
        s += lead + core + trail;
      }
      return s;
    };
    for (const b of blocks) {
      if (b.t === 'table') {
        const grid = Array.from({ length: b.nrows }, () => new Array(b.cols).fill(''));
        for (const row of b.rows) for (const c of row) grid[c.r][c.c] = c.blocks.map((x) => x.t === 'p' ? inline(x.runs) : '[표]').join('<br>').replace(/\n/g, ' ');
        out.push('');
        grid.forEach((row, i) => {
          out.push('| ' + row.map((v) => v || ' ').join(' | ') + ' |');
          if (i === 0) out.push('|' + row.map(() => ' --- ').join('|') + '|');
        });
        out.push('');
        continue;
      }
      let line = inline(b.runs);
      const tag = b.tag || '';
      if (/^H[1-6]$/.test(tag)) line = '#'.repeat(+tag[1]) + ' ' + line.replace(/^\*\*(.*)\*\*$/, '$1');
      else if (b.align === 'center' && line.trim()) line = line; // 마크다운은 정렬 미지원
      out.push(line);
      out.push('');
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
  }
  return { md, txt: (blocks) => DocModel.plainText(blocks) + '\n' };
})();

const PageRender = (() => {
  // 문서를 용지 크기로 잘라 캔버스 페이지 목록을 만든다 (PDF·PNG 공용)
  async function pages(srcEl, page, scale = 2) {
    await Loader.need('html2canvas');
    const pxPerMm = 96 / 25.4;
    const pw = page.w * pxPerMm, ph = page.h * pxPerMm;
    const top = (page.mt + page.hd) * pxPerMm, bottom = (page.mb + page.ft) * pxPerMm;
    const contentH = ph - top - bottom;
    const holder = document.createElement('div');
    holder.style.cssText = `position:fixed;left:-100000px;top:0;width:${pw}px;background:#fff;`;
    const clone = srcEl.cloneNode(true);
    clone.removeAttribute('contenteditable');
    clone.id = 'renderClone';
    clone.style.cssText = `width:${pw}px;min-height:0;padding:0 ${page.mr * pxPerMm}px 0 ${page.ml * pxPerMm}px;margin:0;box-shadow:none;border:0;background:#fff;`;
    clone.querySelectorAll('.page-marker').forEach((m) => m.remove());
    holder.appendChild(clone); document.body.appendChild(holder);
    try {
      // 페이지 경계 후보: 블록·표 행·그림의 아래쪽
      const base = clone.getBoundingClientRect().top;
      const cands = new Set();
      const forced = [];
      clone.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,tr,img,div.textbox,pre,blockquote').forEach((el) => {
        const r = el.getBoundingClientRect(); cands.add(Math.round(r.bottom - base));
      });
      clone.querySelectorAll('.pagebreak').forEach((el) => forced.push(Math.round(el.getBoundingClientRect().top - base)));
      const sorted = [...cands].sort((a, b) => a - b);
      const total = clone.scrollHeight;
      const cuts = []; let start = 0;
      while (start < total - 2) {
        let limit = start + contentH;
        const f = forced.find((y) => y > start + 1 && y <= limit);
        let end;
        if (f !== undefined) end = f;
        else if (limit >= total) end = total;
        else {
          const ok = sorted.filter((y) => y > start + 20 && y <= limit);
          end = ok.length ? ok[ok.length - 1] : limit;
        }
        cuts.push([start, end]);
        start = end;
        if (f !== undefined) start = f + 1;
      }
      if (!cuts.length) cuts.push([0, Math.max(1, total)]);
      const canvas = await html2canvas(clone, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: pw + 40 });
      const k = canvas.width / clone.offsetWidth;
      const out = [];
      for (const [a, b] of cuts) {
        const pc = document.createElement('canvas');
        pc.width = Math.round(pw * k); pc.height = Math.round(ph * k);
        const g = pc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pc.width, pc.height);
        const h = Math.min(b - a, contentH);
        g.drawImage(canvas, 0, Math.round(a * k), canvas.width, Math.round(h * k), 0, Math.round(top * k), canvas.width, Math.round(h * k));
        out.push(pc);
      }
      return out;
    } finally { holder.remove(); }
  }

  async function pdf(srcEl, page) {
    await Loader.need('jspdf');
    const cvs = await pages(srcEl, page, 2);
    const { jsPDF } = window.jspdf;
    const w = Math.min(page.w, page.h), h = Math.max(page.w, page.h);
    const orient = page.landscape ? 'l' : 'p';
    const doc = new jsPDF({ orientation: orient, unit: 'mm', format: [w, h], compress: true });
    cvs.forEach((c, i) => {
      if (i) doc.addPage([w, h], orient);
      doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, page.w, page.h, undefined, 'FAST');
    });
    return new Uint8Array(doc.output('arraybuffer'));
  }

  function mdToHtml(md) {
    const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = (s) => esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>').replace(/~~([^~]+)~~/g, '<s>$1</s>').replace(/`([^`]+)`/g, '<span style="font-family:monospace">$1</span>').replace(/\\([*_`\[\]\\|#])/g, '$1');
    const lines = md.replace(/\r\n?/g, '\n').split('\n'); let out = ''; let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const rows = []; rows.push(l); i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        out += '<table class="hwp-table">' + rows.map((r, ri) => '<tr>' + r.trim().replace(/^\||\|$/g, '').split('|').map((c) => `<td>${ri === 0 ? '<b>' + inline(c.trim()) + '</b>' : inline(c.trim()) || '<br>'}</td>`).join('') + '</tr>').join('') + '</table>';
        continue;
      }
      let m;
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { const n = Math.min(3, m[1].length); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
      if (/^\s*[-*+]\s+/.test(l)) { out += '<ul>'; while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*[-*+]\s+/, ''))}</li>`; out += '</ul>'; continue; }
      if (/^\s*\d+[.)]\s+/.test(l)) { out += '<ol>'; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) out += `<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`; out += '</ol>'; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { out += '<p>' + '─'.repeat(40) + '</p>'; i++; continue; }
      if (/^>\s?/.test(l)) { out += `<blockquote><p>${inline(l.replace(/^>\s?/, ''))}</p></blockquote>`; i++; continue; }
      if (!l.trim()) { i++; continue; }
      let para = l; i++;
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*[-*+]\s|\s*\d+[.)]\s|>|\s*\|)/.test(lines[i])) para += (/ {2}$/.test(para) ? '<br>' : ' ') + lines[i++];
      out += `<p>${inline(para).replace(/&lt;br&gt;/g, '<br>')}</p>`;
    }
    return out;
  }

      const html = ed.innerHTML;
      if (html.length > 4.5e6) return; // 브라우저 저장 한도 보호
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ html, page: state.page, name: $('docName').value, fmt: state.fmt, t: Date.now() }));
      $('stSaved').textContent = '자동 보관됨';
    } catch (e) { /* 저장 공간 없음 등 — 무시 */ }
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* 무시 */ } }
  function checkDraft() {
    let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { d = null; }
    if (!d || !d.html) return;
    $('restoreName').textContent = '"' + (d.name || '문서') + '"';
    $('restoreTime').textContent = new Date(d.t).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    $('restoreBanner').hidden = false;
    $('btnRestore').onclick = () => {
      Object.assign(state.page, d.page || DEFAULT_PAGE); applyPage();
      $('docName').value = d.name || '문서'; setFormat(d.fmt || '복원한 문서', '자동 보관본에서 복원');
      setContent(d.html, { keepDirty: true }); setDirty(true);
      $('restoreBanner').hidden = true;
    };
    $('btnDiscard').onclick = () => { clearDraft(); $('restoreBanner').hidden = true; };
  }

  /* ---------- 시작 ---------- */
  document.execCommand('defaultParagraphSeparator', false, 'p');
  applyPage();
  if (window.innerWidth < 900) { $('zoomSel').value = 'fit'; state.zoomMode = 'fit'; }
  setContent(SAMPLE_DOC);
  $('docName').value = '예시 문서 - 사용 안내';
  setFormat('예시', '처음 화면용 예시 문서입니다. 열기로 내 HWP 파일을 불러오세요.');
  if (state.zoomMode === 'fit') fitZoom();
  checkDraft();
  window.HwpEditor = { state, setContent, buildHwpx, extract: () => DocModel.extract(ed), exportAs, openFile, saveHwpx };
})();

</script>
</body>
</html>
