<title>HWP 편집실</title>
<meta name="description" content="한글(HWP·HWPX) 문서를 브라우저에서 열고 편집하고, 디자인·슬라이드쇼로 바꿔 HWPX·HWP·PPTX·DOCX·PDF 등으로 저장하는 편집기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gowun+Dodum&family=Gowun+Batang&family=Nanum+Pen+Script&family=Gaegu&family=Song+Myung&display=swap">
<style>
/* 레이아웃: 상단 파일 막대(모드 전환) + 문서 모드(리본·상황 막대·쪽) / 디자인 모드(도구·쪽 목록·작업면·속성) */
:root {
  --bg: #ffffff;          /* 작업면 (항상 흰색) */
  --ink: #1b2333;         /* 본문 글자 */
  --ink-2: #5b6578;       /* 보조 글자 */
  --line: #e3e7ee;        /* 구분선 */
  --line-2: #cfd6e2;
  --tint: #f4f6fa;        /* 버튼 눌림·호버 */
  --accent: #1f4fbf;      /* 한컴 파랑 계열 */
  --accent-ink: #ffffff;
  --accent-soft: #e8eefb;
  --warn: #b45309;
  --danger: #b42318;
  --ok: #157f3b;
  --sel: #2563eb;         /* 개체 선택 테두리 */
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --doc: "함초롬바탕", "HCR Batang", "Noto Serif KR", "Nanum Myeongjo", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--ui); margin: 0; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: calc(100% - var(--anav-h, 63px)); } /* 상단 공통 메뉴바(arte-bar) 아래에 편집기 배치 */

/* 상단 파일 막대 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.docname { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.docname input { min-width: 0; flex: 1; max-width: 380px; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; font-size: 14px; font-weight: 500; background: transparent; }
.docname input:hover { border-color: var(--line); }
.docname input:focus { outline: none; border-color: var(--accent); background: #fff; }
.fmt-chip { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.dirty-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: none; }
.app.dirty .dirty-dot { display: inline-block; }
.modes { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--tint); }
.modes button { border: 0; background: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.modes button svg { width: 15px; height: 15px; }
.modes button.on { background: #fff; color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(27,35,51,.12); }
.file-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: #fff; border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { background: #1a43a6; }
.btn.danger { color: var(--danger); }
.btn svg { width: 15px; height: 15px; flex: none; }

/* 서식 리본 */
.ribbon { display: flex; align-items: center; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.grp { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-right: 1px solid var(--line); flex: none; }
.grp:last-child { border-right: 0; }
.tb { width: 30px; height: 30px; border: 1px solid transparent; background: transparent; border-radius: 6px; cursor: pointer; display: grid; place-items: center; position: relative; flex: none; padding: 0; }
.tb:hover { background: var(--tint); }
.tb.on { background: var(--accent-soft); border-color: #c5d3f3; color: var(--accent); }
.tb svg { width: 17px; height: 17px; }
.tb .sw { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 1px; }
.tb.wide { width: auto; padding: 0 8px; gap: 5px; display: inline-flex; }
.tb.sm { width: 24px; height: 24px; }
.tb.sm svg { width: 14px; height: 14px; }
.tb-txt { font-size: 12px; white-space: nowrap; }
.sel { height: 30px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; padding: 0 6px; cursor: pointer; }
.sel:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
#fontSel { width: 128px; } #sizeSel { width: 62px; } #styleSel { width: 84px; } #lhSel { width: 72px; }

/* 상황 막대(표·그림·개체) */
.ctxbar { display: flex; align-items: center; gap: 4px; padding: 5px 16px; border-bottom: 1px solid var(--line); background: #fafbfd; overflow-x: auto; flex-wrap: nowrap; }
.ctxbar .label { font-size: 12px; font-weight: 600; color: var(--accent); margin-right: 6px; white-space: nowrap; }
.ctxbar .btn { padding: 4px 9px; font-size: 12px; }
.ctxbar .sel { height: 28px; font-size: 12px; }
.ctxbar input[type=number] { width: 70px; height: 28px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; }
.ctxbar .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; flex: none; }
.ctxbar label.inl { display: flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; font-size: 12px; }

/* 작업면 */
.workspace { flex: 1; overflow: auto; position: relative; background: var(--bg); }
.workspace.drop { outline: 3px dashed var(--accent); outline-offset: -10px; }
#zoomWrap { padding: 28px 16px 60px; width: max-content; min-width: 100%; box-sizing: border-box; }
.sheet { position: relative; margin: 0 auto; width: max-content; }
.page { position: relative; isolation: isolate; overflow: hidden; box-sizing: border-box; background: #fff; border: 1px solid var(--line-2); box-shadow: 0 1px 2px rgba(27,35,51,.06), 0 8px 28px rgba(27,35,51,.07);
  font-family: var(--doc); font-size: 10pt; line-height: 1.6; color: #000; text-align: justify; word-break: keep-all; overflow-wrap: anywhere; outline: none; tab-size: 4; caret-color: #000; counter-reset: fn; }
.page p, .page h1, .page h2, .page h3, .page li, .page div { margin: 0; }
.page p, .page h1, .page h2, .page h3, .page h4, .page li, .page blockquote, .page div:not(.fobj) { position: relative; }
.page h1 { font-size: 18pt; font-weight: bold; margin: 6pt 0; line-height: 1.4; }
.page h2 { font-size: 15pt; font-weight: bold; margin: 5pt 0; line-height: 1.4; }
.page h3 { font-size: 12pt; font-weight: bold; margin: 4pt 0; line-height: 1.4; }
.page blockquote { margin: 0 0 0 10mm; padding-left: 3mm; border-left: 2px solid #bbb; }
.page ul, .page ol { margin: 0; padding-left: 7mm; }
.page table { border-collapse: collapse; margin: 1px 0; table-layout: fixed; max-width: 100%; }
.page td, .page th { border: 1px solid #000; padding: .5mm 1.8mm; vertical-align: middle; min-width: 8px; word-break: keep-all; overflow-wrap: anywhere; position: relative; }
.page table.noborder td { border: 1px dotted #c6cdd9; }
.page td.cell-sel { box-shadow: inset 0 0 0 2px rgba(31,79,191,.45); }
.page img { max-width: 100%; vertical-align: bottom; }
.page img[data-wrap="square"] { margin: 1mm 3mm 2mm 0; }
.page img[data-wrap="square"][style*="right"] { margin: 1mm 0 2mm 3mm; }
.page img[data-wrap="block"] { display: block; margin: 2mm 0; }
.page img[data-wrap="block"][data-align="center"] { margin-left: auto; margin-right: auto; }
.page img[data-wrap="block"][data-align="right"] { margin-left: auto; }
.page a[href] { color: #1f4fbf; text-decoration: underline; cursor: text; }
.page .tab { white-space: pre; }
.page .textbox { border: 1px dashed #c6cdd9; padding: 1mm 2mm; margin: 1mm 0; }
.page .eq { font-family: var(--mono); font-size: .92em; background: #f1f3f7; padding: 0 3px; border-radius: 3px; }
.page .ph { color: #8a93a3; font-size: .9em; }
.page .fn { counter-increment: fn; cursor: pointer; }
.page .fn::after { content: counter(fn) ")"; vertical-align: super; font-size: .72em; color: #1f4fbf; font-family: var(--ui); padding: 0 1px; }
/* 떠 있는 개체: 글 앞/뒤(종이 위 자유 배치), 어울림/자리 차지(글과 함께 흐름) */
.page .fobj { position: absolute; z-index: 3; display: block; box-sizing: border-box; line-height: normal; text-indent: 0; text-align: left; }
.page .fobj[data-wrap="behind"] { z-index: -1; }
.page .fobj[data-wrap="square"] { position: relative; float: left; margin: 1mm 3mm 2mm 0; left: auto !important; top: auto !important; }
.page .fobj[data-wrap="square"][data-align="right"] { float: right; margin: 1mm 0 2mm 3mm; }
.page .fobj[data-wrap="block"] { position: relative; margin: 2mm 0; left: auto !important; top: auto !important; }
.page .fobj[data-wrap="block"][data-align="center"] { margin-left: auto; margin-right: auto; }
.page .fobj[data-wrap="block"][data-align="right"] { margin-left: auto; }
.page .fobj > img { width: 100%; height: 100%; display: block; max-width: none; }
.page .fobj > svg { display: block; overflow: visible; }
.page .fobj .tbox { width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; outline: none; cursor: text; }
.page .fobj .tbox:not([style*="border"]) { box-shadow: inset 0 0 0 1px rgba(143,160,190,.45); }
.page .pagebreak { height: 0; border-top: 1px dashed #8fa6dc; margin: 8px 0; position: relative; user-select: none; box-sizing: content-box; }
.page .pagebreak::after { content: "쪽 나누기"; position: absolute; right: 0; top: -9px; font: 10px var(--ui); color: var(--accent); background: #fff; padding: 0 4px; }
.page ::selection { background: #c9d7f7; }
.page.painting { cursor: copy; }
.markers { position: absolute; inset: 0; pointer-events: none; }
.marker { position: absolute; left: -1px; right: -1px; height: 0; border-top: 1px dashed #c8d0de; }
.marker span { position: absolute; right: -54px; top: -8px; font: 11px var(--ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hfz { position: absolute; font-family: var(--doc); font-size: 9pt; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fn-list { margin: 10px auto 0; font: 12px/1.6 var(--doc); color: #333; border-top: 1px solid #999; padding-top: 6px; }
.fn-list .fn-h { font: 600 11px var(--ui); color: var(--ink-2); margin-bottom: 2px; }
.fn-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 1px 2px; cursor: pointer; font: inherit; color: inherit; border-radius: 4px; }
.fn-list button:hover { background: var(--tint); }
/* 개체 선택 상자 */
#objBox { position: absolute; border: 1.5px solid var(--sel); pointer-events: none; z-index: 20; box-sizing: border-box; }
#objBox .oh { position: absolute; width: 10px; height: 10px; background: #fff; border: 1.5px solid var(--sel); border-radius: 2px; pointer-events: auto; box-sizing: border-box; }
#objBox .oh[data-h="nw"] { left: -6px; top: -6px; cursor: nwse-resize; } #objBox .oh[data-h="ne"] { right: -6px; top: -6px; cursor: nesw-resize; }
#objBox .oh[data-h="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; } #objBox .oh[data-h="se"] { right: -6px; bottom: -6px; cursor: nwse-resize; }
#objBox .oh[data-h="n"] { left: calc(50% - 5px); top: -6px; cursor: ns-resize; } #objBox .oh[data-h="s"] { left: calc(50% - 5px); bottom: -6px; cursor: ns-resize; }
#objBox .oh[data-h="e"] { right: -6px; top: calc(50% - 5px); cursor: ew-resize; } #objBox .oh[data-h="w"] { left: -6px; top: calc(50% - 5px); cursor: ew-resize; }
#objBox .omove { position: absolute; left: -1px; top: -24px; height: 20px; padding: 0 7px; display: flex; align-items: center; gap: 4px; background: var(--sel); color: #fff; font: 11px var(--ui); border-radius: 4px 4px 0 0; pointer-events: auto; cursor: move; white-space: nowrap; }
#objBox .osize { position: absolute; right: -1px; bottom: -22px; font: 11px var(--ui); color: #fff; background: rgba(27,35,51,.75); border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
.colgrip { position: absolute; width: 7px; cursor: col-resize; z-index: 15; }
.colgrip:hover, .colgrip.on { background: rgba(37,99,235,.35); }

/* 상태줄 */
.status { display: flex; align-items: center; gap: 16px; padding: 5px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); flex-wrap: wrap; padding-bottom: calc(5px + env(safe-area-inset-bottom, 0px)); }
.status .sp { flex: 1; }
.status b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.status .chip { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 1px 9px; cursor: pointer; font-size: 12px; }
.status .chip:hover { background: var(--tint); }
.zoom { display: flex; align-items: center; gap: 4px; }
.zoom select, .dstatus select { height: 24px; border: 1px solid var(--line-2); border-radius: 5px; background: #fff; }

/* 펼침 메뉴·팝오버 */
.pop { position: fixed; z-index: 70; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 34px rgba(27,35,51,.16); padding: 6px; min-width: 200px; max-height: calc(100vh - 24px); overflow: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--tint); outline: none; }
.menu-item .ext { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); padding-left: 12px; }
.menu-item small { display: block; color: var(--ink-2); font-size: 11px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-head { font-size: 11px; color: var(--ink-2); padding: 6px 10px 4px; letter-spacing: .04em; }
.swatches { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; padding: 4px; }
.swatches button { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
.swatches button:hover { transform: scale(1.12); }
.pop-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px 2px; font-size: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(10, 18px); gap: 3px; padding: 6px; }
.tgrid i { width: 18px; height: 18px; border: 1px solid var(--line-2); border-radius: 3px; display: block; cursor: pointer; }
.tgrid i.on { background: var(--accent-soft); border-color: var(--accent); }
.tgrid-label { text-align: center; font-size: 12px; color: var(--ink-2); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.chars { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; padding: 4px; }
.chars button { height: 30px; border: 1px solid transparent; background: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
.chars button:hover { background: var(--tint); border-color: var(--line); }

/* 찾기 패널 */
.findbar { position: absolute; top: 10px; right: 18px; z-index: 30; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 8px 26px rgba(27,35,51,.14); padding: 10px; display: grid; gap: 6px; width: min(340px, calc(100vw - 40px)); }
.findbar .row { display: flex; gap: 6px; align-items: center; }
.findbar input[type=text] { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; }
.findbar .btn { padding: 4px 9px; font-size: 12px; }
.findbar .count { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* 대화상자 */
.modal-back { position: fixed; inset: 0; background: rgba(27,35,51,.28); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(27,35,51,.25); width: min(480px, 100%); padding: 20px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.modal p { margin: 0; color: var(--ink-2); line-height: 1.6; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.modal .choice { display: grid; gap: 8px; }
.modal .choice button { text-align: left; border: 1px solid var(--line-2); background: #fff; border-radius: 9px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.modal .choice button:hover, .modal .choice button:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.modal .choice b { font-weight: 600; }
.modal .choice span { color: var(--ink-2); font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.field input, .field select, .field textarea { height: 32px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
.field textarea { height: auto; min-height: 70px; padding: 6px 8px; resize: vertical; font: inherit; }
.field input[type=color] { padding: 2px; width: 100%; }
.field.full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
.checks label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 6px; cursor: pointer; font-size: 13px; color: var(--ink); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--accent); font-weight: 600; }
.seg label:has(input:checked) { background: var(--accent-soft); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.preview-box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--doc); min-height: 28px; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 2147483600; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 26px rgba(0,0,0,.2); max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast.err { background: var(--danger); }
.toast button { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.busy { position: fixed; inset: 0; z-index: 90; background: rgba(255,255,255,.72); display: grid; place-items: center; }
.busy-box { background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 18px 22px; box-shadow: 0 12px 40px rgba(27,35,51,.15); display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { display: flex; gap: 10px; align-items: center; padding: 8px 16px; background: #fff7e8; border-bottom: 1px solid #f3dfb5; font-size: 13px; flex-wrap: wrap; }
.banner .sp { flex: 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.page:focus-visible, .tbox:focus-visible, .ly-t:focus-visible, .dstage:focus-visible { outline: none; }

/* ===== 디자인 모드 ===== */
.design { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.dbar .btn { padding: 5px 10px; }
.dbar .sp { flex: 1; }
